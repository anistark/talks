document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: #F1ECE1; }\n  a { color: #2F6B40; text-decoration: none; }\n  a:hover { color: #1F4C2D; }\n  @keyframes sweep { from { left: 0%; } to { left: 100%; } }\n  @keyframes blink { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }\n  @keyframes popfade { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }\n  @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }\n  @keyframes dashmarch { to { stroke-dashoffset: -40; } }\n  @keyframes nudger { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(7px); } }\n  @keyframes nudgel { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-7px); } }\n  #fsbtn { position: fixed; top: 18px; right: 18px; z-index: 9999; width: 52px; height: 52px;\n    border: 1px solid #DCD2C0; background: rgba(246,241,232,0.9); color: #6E6455; font-size: 24px;\n    font-family: 'JetBrains Mono', monospace; cursor: pointer; opacity: 0.35; transition: opacity 0.2s; }\n  #fsbtn:hover { opacity: 1; }\n<\u002Fstyle>\n<script src=\"44842bef-7649-48c9-9ff5-656dcb50848c\"><\u002Fscript>\n<script src=\"93f1bff2-e968-41a3-930e-10a4c581cfb9\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<deck-stage width=\"1920\" height=\"1080\">\n<section data-label=\"Title\" data-speaker-notes=\"This slide sits on screen while I do the cold open. I walk around Helicon live, jump off the roof, bump the bookshelf. Then the line: static site, no server, no game engine, no 3D assets. Every object is generated from a seed, and everything that just stopped me from falling through the floor is Rust. Flip the ?debug wireframe view, then come back here and start.\" style=\"background:#FCFAF4; color:#332C21; font-family:'Space Grotesk',sans-serif; box-sizing:border-box; padding:100px 110px 80px 110px; display:flex; flex-direction:column; justify-content:center; overflow:hidden;\">\n  <div style=\"position:absolute; inset:0; pointer-events:none; opacity:0.5; background-image:repeating-linear-gradient(0deg, rgba(47,107,64,0.08) 0px, rgba(47,107,64,0.08) 1px, transparent 1px, transparent 108px), repeating-linear-gradient(90deg, rgba(47,107,64,0.08) 0px, rgba(47,107,64,0.08) 1px, transparent 1px, transparent 108px);\"><\u002Fdiv>\n  <div style=\"position:absolute; top:0; bottom:0; right:0; width:980px; pointer-events:none; -webkit-mask-image:linear-gradient(to left, black 15%, rgba(0,0,0,0.55) 50%, transparent 85%); mask-image:linear-gradient(to left, black 15%, rgba(0,0,0,0.55) 50%, transparent 85%);\">\n    <svg viewBox=\"0 0 980 1080\" width=\"980\" height=\"1080\">\n      <line x1=\"470\" y1=\"270\" x2=\"640\" y2=\"330\" stroke=\"#C9BEAC\" stroke-width=\"2\"><\u002Fline>\n      <line x1=\"640\" y1=\"330\" x2=\"560\" y2=\"700\" stroke=\"#C9BEAC\" stroke-width=\"2\"><\u002Fline>\n      <line x1=\"560\" y1=\"700\" x2=\"760\" y2=\"640\" stroke=\"#C9BEAC\" stroke-width=\"2\"><\u002Fline>\n      <line x1=\"760\" y1=\"640\" x2=\"850\" y2=\"410\" stroke=\"#C9BEAC\" stroke-width=\"2\"><\u002Fline>\n      <line x1=\"790\" y1=\"170\" x2=\"850\" y2=\"410\" stroke=\"#C9BEAC\" stroke-width=\"2\"><\u002Fline>\n      <line x1=\"470\" y1=\"270\" x2=\"790\" y2=\"170\" stroke=\"#C9BEAC\" stroke-width=\"2\"><\u002Fline>\n      <rect x=\"540\" y=\"230\" width=\"200\" height=\"200\" fill=\"none\" stroke=\"#2F6B40\" stroke-width=\"2.5\" transform=\"rotate(45 640 330)\"><\u002Frect>\n      <rect x=\"690\" y=\"570\" width=\"140\" height=\"140\" fill=\"none\" stroke=\"#2F6B40\" stroke-width=\"2.5\" style=\"animation:floaty 8s ease-in-out 1.5s infinite;\"><\u002Frect>\n      <rect x=\"745\" y=\"125\" width=\"90\" height=\"90\" fill=\"none\" stroke=\"#C9BEAC\" stroke-width=\"2\" transform=\"rotate(45 790 170)\"><\u002Frect>\n      <rect x=\"425\" y=\"225\" width=\"90\" height=\"90\" fill=\"none\" stroke=\"#C9BEAC\" stroke-width=\"2\" style=\"animation:floaty 7s ease-in-out infinite;\"><\u002Frect>\n      <rect x=\"500\" y=\"640\" width=\"120\" height=\"120\" fill=\"none\" stroke=\"#C9BEAC\" stroke-width=\"2\" transform=\"rotate(45 560 700)\"><\u002Frect>\n      <rect x=\"300\" y=\"830\" width=\"110\" height=\"110\" fill=\"none\" stroke=\"#C9BEAC\" stroke-width=\"2\" stroke-dasharray=\"8 6\" style=\"animation:dashmarch 3s linear infinite;\"><\u002Frect>\n      <rect x=\"838\" y=\"398\" width=\"24\" height=\"24\" fill=\"#2F6B40\" style=\"animation:blink 3.6s ease-in-out infinite;\"><\u002Frect>\n      <rect x=\"548\" y=\"688\" width=\"20\" height=\"20\" fill=\"#2F6B40\" style=\"animation:blink 3.6s ease-in-out 0.8s infinite;\"><\u002Frect>\n      <rect x=\"628\" y=\"912\" width=\"16\" height=\"16\" fill=\"#C9BEAC\" style=\"animation:blink 3.6s ease-in-out 1.6s infinite;\"><\u002Frect>\n      <circle cx=\"470\" cy=\"270\" r=\"7\" fill=\"#2F6B40\" style=\"animation:blink 3.6s ease-in-out 0.4s infinite;\"><\u002Fcircle>\n      <circle cx=\"760\" cy=\"640\" r=\"7\" fill=\"#2F6B40\" style=\"animation:blink 3.6s ease-in-out 1.2s infinite;\"><\u002Fcircle>\n      <circle cx=\"880\" cy=\"820\" r=\"10\" fill=\"none\" stroke=\"#C9BEAC\" stroke-width=\"2\"><\u002Fcircle>\n    <\u002Fsvg>\n  <\u002Fdiv>\n  <div style=\"position:relative; display:flex; flex-direction:column; gap:36px;\">\n    <h1 style=\"margin:0; font-size:168px; font-weight:700; line-height:1.02; letter-spacing:-0.02em;\">Physics at 60fps<\u002Fh1>\n    <div style=\"font-family:'JetBrains Mono',monospace; font-size:34px; color:#2F6B40;\">Rust, Rapier, and the browser frame budget<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute; left:110px; bottom:80px; display:flex; flex-direction:column; gap:14px;\">\n    <div style=\"font-size:44px; font-weight:500; color:#332C21;\">Kumar Anirudha<\u002Fdiv>\n    <div style=\"font-family:'JetBrains Mono',monospace; font-size:30px; color:#6E6455;\">x.com/kranirudha<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Invisible Half\" data-speaker-notes=\"Coming straight out of the live walk. What you saw on screen, the colors and shapes, all of that is JavaScript and WebGL. But what stopped me from falling through the floor is a completely separate world you never see. It is a Rust physics engine, compiled to WebAssembly, recalculating everything 60 times a second. Two halves: the pretty one is JS, the real one is Rust. This talk is about the invisible half.\" style=\"background:#FCFAF4; color:#332C21; font-family:'Space Grotesk',sans-serif; box-sizing:border-box; padding:90px 100px 80px 100px; display:flex; flex-direction:column; gap:48px;\">\n  <h2 style=\"margin:0; font-size:68px; font-weight:700; letter-spacing:-0.01em;\">The Invisible Half of the World<\u002Fh2>\n  <div style=\"display:flex; gap:40px;\">\n    <div style=\"display:flex; flex-direction:column; gap:20px;\">\n      <div style=\"width:840px; height:540px;\"><image-slot id=\"helicon-rendered\" shape=\"rect\" placeholder=\"drop: helicon, rendered view\" src=\"0e6811c3-4897-4684-b65c-c88bd9e6e471\"><\u002Fimage-slot><\u002Fdiv>\n      <div style=\"display:flex; align-items:baseline; gap:20px; font-family:'JetBrains Mono',monospace; font-size:25px;\"><span style=\"color:#332C21;\">rendered<\u002Fspan> <span style=\"color:#6E6455;\">JavaScript + WebGL<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column; gap:20px;\">\n      <div style=\"width:840px; height:540px;\"><image-slot id=\"helicon-debug\" shape=\"rect\" placeholder=\"drop: helicon, ?debug collider view\" src=\"a32a0a11-2000-4df2-8869-20bb2780be78\"><\u002Fimage-slot><\u002Fdiv>\n      <div style=\"display:flex; align-items:baseline; gap:20px; font-family:'JetBrains Mono',monospace; font-size:25px;\"><span style=\"color:#2F6B40;\">collider debug<\u002Fspan> <span style=\"color:#6E6455;\">Rust → WASM, stepping 60×/s<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Pipeline\" data-speaker-notes=\"Here is what a physics engine actually does, once per frame. Think of a room full of boxes. First question: who could possibly be touching? Checking every box against every other box is way too slow, so the broad phase does a cheap rough pass and hands back a short list of maybe pairs. Second: for those pairs, where exactly do they touch? That gives contact points. Third: the solver. Things are overlapping and pushing on each other, so it nudges them apart without breaking gravity or other contacts. Fourth: integrate, which just means move everything by its velocity and write the new positions. And here is the catch: at 60fps the whole thing has 16.6 milliseconds, shared with rendering and everything else, on one CPU thread.\" style=\"background:#FCFAF4; color:#332C21; font-family:'Space Grotesk',sans-serif; box-sizing:border-box; padding:90px 100px 80px 100px; display:flex; flex-direction:column; gap:52px;\">\n  <h2 style=\"margin:0; font-size:68px; font-weight:700; letter-spacing:-0.01em;\">The Per-Frame Pipeline<\u002Fh2>\n  <div style=\"position:relative; display:flex; align-items:center; gap:0; border:1px solid #DCD2C0; height:76px; margin-top:10px;\">\n    <div style=\"position:absolute; top:0; bottom:0; width:2px; background:rgba(51,44,33,0.4); animation:sweep 6s linear infinite;\"><\u002Fdiv>\n    <div style=\"flex:2; height:100%; background:#EDE4D3; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:24px; color:#5C5344; border-right:1px solid #DCD2C0;\">broad-phase<\u002Fdiv>\n    <div style=\"flex:2.5; height:100%; background:#E4D8C2; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:24px; color:#5C5344; border-right:1px solid #DCD2C0;\">narrow-phase<\u002Fdiv>\n    <div style=\"flex:4; height:100%; background:rgba(47,107,64,0.16); display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:24px; color:#1F4C2D; border-right:1px solid #DCD2C0;\">constraint solve<\u002Fdiv>\n    <div style=\"flex:1.5; height:100%; background:#EDE4D3; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:24px; color:#5C5344;\">integrate<\u002Fdiv>\n    <div style=\"width:170px; height:100%; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:26px; color:#2F6B40; border-left:2px dashed #2F6B40;\">16.6 ms<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex; gap:32px; margin-top:14px;\">\n    <div style=\"flex:1; display:flex; flex-direction:column; gap:20px;\">\n      <div style=\"height:170px; border:1px solid #E7DECF; background:#F5EFE3; display:flex; align-items:center; justify-content:center;\"><svg viewBox=\"0 0 160 100\" width=\"240\" height=\"150\"><rect x=\"12\" y=\"14\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"#C9BEAC\" stroke-width=\"2\"><\u002Frect><rect x=\"120\" y=\"10\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"#C9BEAC\" stroke-width=\"2\"><\u002Frect><rect x=\"30\" y=\"66\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"#C9BEAC\" stroke-width=\"2\"><\u002Frect><rect x=\"70\" y=\"38\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"#2F6B40\" stroke-width=\"2.5\"><\u002Frect><rect x=\"92\" y=\"46\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"#2F6B40\" stroke-width=\"2.5\"><\u002Frect><rect x=\"62\" y=\"30\" width=\"56\" height=\"42\" fill=\"none\" stroke=\"#2F6B40\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\" style=\"animation:dashmarch 2.5s linear infinite;\"><\u002Frect><rect x=\"128\" y=\"70\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"#C9BEAC\" stroke-width=\"2\"><\u002Frect><\u002Fsvg><\u002Fdiv>\n      <div style=\"font-size:31px; font-weight:500;\">who might touch?<\u002Fdiv>\n      <div style=\"font-size:25px; color:#6E6455; line-height:1.45; text-wrap:pretty;\">cheap pass over bounding boxes. Skips the pairs that are obviously far apart.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1; display:flex; flex-direction:column; gap:20px;\">\n      <div style=\"height:170px; border:1px solid #E7DECF; background:#F5EFE3; display:flex; align-items:center; justify-content:center;\"><svg viewBox=\"0 0 160 100\" width=\"240\" height=\"150\"><rect x=\"42\" y=\"26\" width=\"40\" height=\"40\" fill=\"none\" stroke=\"#5C5344\" stroke-width=\"2.5\"><\u002Frect><rect x=\"72\" y=\"42\" width=\"40\" height=\"40\" fill=\"none\" stroke=\"#5C5344\" stroke-width=\"2.5\"><\u002Frect><circle cx=\"77\" cy=\"55\" r=\"5\" fill=\"#2F6B40\" style=\"animation:blink 2s ease-in-out infinite;\"><\u002Fcircle><circle cx=\"77\" cy=\"66\" r=\"5\" fill=\"#2F6B40\" style=\"animation:blink 2s ease-in-out 0.4s infinite;\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n      <div style=\"font-size:31px; font-weight:500;\">where exactly?<\u002Fdiv>\n      <div style=\"font-size:25px; color:#6E6455; line-height:1.45; text-wrap:pretty;\">exact math on the survivors. Produces contact points between shapes.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1; display:flex; flex-direction:column; gap:20px;\">\n      <div style=\"height:170px; border:1px solid #E7DECF; background:#F5EFE3; display:flex; align-items:center; justify-content:center;\"><svg viewBox=\"0 0 160 100\" width=\"240\" height=\"150\"><rect x=\"38\" y=\"30\" width=\"40\" height=\"40\" fill=\"none\" stroke=\"#5C5344\" stroke-width=\"2.5\"><\u002Frect><rect x=\"82\" y=\"30\" width=\"40\" height=\"40\" fill=\"none\" stroke=\"#5C5344\" stroke-width=\"2.5\"><\u002Frect><g style=\"animation:nudgel 2s ease-in-out infinite;\"><line x1=\"34\" y1=\"50\" x2=\"14\" y2=\"50\" stroke=\"#2F6B40\" stroke-width=\"3\"><\u002Fline><polygon points=\"14,45 14,55 5,50\" fill=\"#2F6B40\"><\u002Fpolygon><\u002Fg><g style=\"animation:nudger 2s ease-in-out infinite;\"><line x1=\"126\" y1=\"50\" x2=\"146\" y2=\"50\" stroke=\"#2F6B40\" stroke-width=\"3\"><\u002Fline><polygon points=\"146,45 146,55 155,50\" fill=\"#2F6B40\"><\u002Fpolygon><\u002Fg><\u002Fsvg><\u002Fdiv>\n      <div style=\"font-size:31px; font-weight:500;\">push apart<\u002Fdiv>\n      <div style=\"font-size:25px; color:#6E6455; line-height:1.45; text-wrap:pretty;\">the solver resolves overlaps and forces without breaking other contacts. The expensive part.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1; display:flex; flex-direction:column; gap:20px;\">\n      <div style=\"height:170px; border:1px solid #E7DECF; background:#F5EFE3; display:flex; align-items:center; justify-content:center;\"><svg viewBox=\"0 0 160 100\" width=\"240\" height=\"150\"><rect x=\"24\" y=\"34\" width=\"34\" height=\"34\" fill=\"none\" stroke=\"#C9BEAC\" stroke-width=\"2\" stroke-dasharray=\"5 4\"><\u002Frect><g style=\"animation:nudger 2.2s ease-in-out infinite;\"><line x1=\"64\" y1=\"51\" x2=\"94\" y2=\"51\" stroke=\"#2F6B40\" stroke-width=\"3\"><\u002Fline><polygon points=\"94,46 94,56 103,51\" fill=\"#2F6B40\"><\u002Fpolygon><rect x=\"106\" y=\"34\" width=\"34\" height=\"34\" fill=\"none\" stroke=\"#5C5344\" stroke-width=\"2.5\"><\u002Frect><\u002Fg><\u002Fsvg><\u002Fdiv>\n      <div style=\"font-size:31px; font-weight:500;\">move everything<\u002Fdiv>\n      <div style=\"font-size:25px; color:#6E6455; line-height:1.45; text-wrap:pretty;\">apply velocities, write the new positions. The renderer reads these.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Inside the Solver\" data-speaker-notes=\"A level deeper, still in plain words. Sweep and prune: sort everything along one axis, then only compare neighbors, like finding people with the same birthday by sorting the list first. Contact caching: if two crates were touching last frame they probably still are, so keep that answer and just update it. Sequential impulses: fix contacts one at a time, and fixing one can disturb another, so loop over them a few times until it settles. Warm starting means you begin from last frame's answer instead of from scratch, which converges way faster. Islands: only connected groups affect each other, so solve each group separately, and a group at rest is asleep and costs literally nothing. The takeaway: this is tight number crunching over big arrays, and the last thing you want in the middle of it is a memory allocator or a garbage collector.\" style=\"background:#FCFAF4; color:#332C21; font-family:'Space Grotesk',sans-serif; box-sizing:border-box; padding:90px 100px 80px 100px; display:flex; flex-direction:column; gap:48px;\">\n  <h2 style=\"margin:0; font-size:68px; font-weight:700; letter-spacing:-0.01em;\">Inside the Solver<\u002Fh2>\n  <div style=\"display:flex; flex-direction:column;\">\n    <div style=\"display:flex; align-items:center; gap:44px; padding:30px 0; border-bottom:1px solid #E7DECF;\">\n      <div style=\"width:230px; height:96px; border:1px solid #E7DECF; background:#F5EFE3; display:flex; align-items:center; justify-content:center; flex-shrink:0;\"><svg viewBox=\"0 0 160 60\" width=\"200\" height=\"76\"><line x1=\"8\" y1=\"48\" x2=\"152\" y2=\"48\" stroke=\"#C9BEAC\" stroke-width=\"2\"><\u002Fline><rect x=\"16\" y=\"26\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"#C9BEAC\" stroke-width=\"2\"><\u002Frect><rect x=\"126\" y=\"26\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"#C9BEAC\" stroke-width=\"2\"><\u002Frect><g style=\"animation:nudger 2.4s ease-in-out infinite;\"><rect x=\"52\" y=\"26\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"#2F6B40\" stroke-width=\"2.5\"><\u002Frect><rect x=\"74\" y=\"26\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"#2F6B40\" stroke-width=\"2.5\"><\u002Frect><line x1=\"50\" y1=\"16\" x2=\"92\" y2=\"16\" stroke=\"#2F6B40\" stroke-width=\"2\"><\u002Fline><\u002Fg><\u002Fsvg><\u002Fdiv>\n      <div style=\"width:380px; font-family:'JetBrains Mono',monospace; font-size:28px; color:#2F6B40;\">sweep and prune<\u002Fdiv>\n      <div style=\"flex:1; font-size:28px; color:#4A4234; line-height:1.45; text-wrap:pretty;\">sort everything along one axis, then only compare neighbors. Sorting is cheap, comparing everyone is not.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap:44px; padding:30px 0; border-bottom:1px solid #E7DECF;\">\n      <div style=\"width:230px; height:96px; border:1px solid #E7DECF; background:#F5EFE3; display:flex; align-items:center; justify-content:center; flex-shrink:0;\"><svg viewBox=\"0 0 160 60\" width=\"200\" height=\"76\"><rect x=\"48\" y=\"10\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"#5C5344\" stroke-width=\"2.5\"><\u002Frect><rect x=\"70\" y=\"22\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"#5C5344\" stroke-width=\"2.5\"><\u002Frect><circle cx=\"74\" cy=\"32\" r=\"4\" fill=\"#2F6B40\" style=\"animation:blink 2s ease-in-out infinite;\"><\u002Fcircle><circle cx=\"74\" cy=\"40\" r=\"4\" fill=\"#2F6B40\" style=\"animation:blink 2s ease-in-out 0.4s infinite;\"><\u002Fcircle><rect x=\"118\" y=\"14\" width=\"30\" height=\"34\" fill=\"none\" stroke=\"#C9BEAC\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\" style=\"animation:dashmarch 3s linear infinite;\"><\u002Frect><\u002Fsvg><\u002Fdiv>\n      <div style=\"width:380px; font-family:'JetBrains Mono',monospace; font-size:28px; color:#2F6B40;\">contact caching<\u002Fdiv>\n      <div style=\"flex:1; font-size:28px; color:#4A4234; line-height:1.45; text-wrap:pretty;\">touching last frame means probably touching now. Keep the answer, update only what moved.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap:44px; padding:30px 0; border-bottom:1px solid #E7DECF;\">\n      <div style=\"width:230px; height:96px; border:1px solid #E7DECF; background:#F5EFE3; display:flex; align-items:center; justify-content:center; flex-shrink:0;\"><svg viewBox=\"0 0 160 60\" width=\"200\" height=\"76\"><circle cx=\"30\" cy=\"30\" r=\"10\" fill=\"none\" stroke=\"#2F6B40\" stroke-width=\"2.5\" style=\"animation:popfade 2.4s ease-in-out infinite;\"><\u002Fcircle><circle cx=\"70\" cy=\"30\" r=\"10\" fill=\"none\" stroke=\"#C9BEAC\" stroke-width=\"2\" style=\"animation:popfade 2.4s ease-in-out 0.4s infinite;\"><\u002Fcircle><circle cx=\"110\" cy=\"30\" r=\"10\" fill=\"none\" stroke=\"#C9BEAC\" stroke-width=\"2\" style=\"animation:popfade 2.4s ease-in-out 0.8s infinite;\"><\u002Fcircle><line x1=\"44\" y1=\"30\" x2=\"56\" y2=\"30\" stroke=\"#5C5344\" stroke-width=\"2\"><\u002Fline><line x1=\"84\" y1=\"30\" x2=\"96\" y2=\"30\" stroke=\"#5C5344\" stroke-width=\"2\"><\u002Fline><line x1=\"124\" y1=\"30\" x2=\"136\" y2=\"30\" stroke=\"#5C5344\" stroke-width=\"2\"><\u002Fline><polygon points=\"136,26 136,34 144,30\" fill=\"#5C5344\"><\u002Fpolygon><\u002Fsvg><\u002Fdiv>\n      <div style=\"width:380px; font-family:'JetBrains Mono',monospace; font-size:28px; color:#2F6B40;\">sequential impulses<\u002Fdiv>\n      <div style=\"flex:1; font-size:28px; color:#4A4234; line-height:1.45; text-wrap:pretty;\">fix contacts one by one, loop until it settles. Warm start: begin from last frame's answer.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap:44px; padding:30px 0;\">\n      <div style=\"width:230px; height:96px; border:1px solid #E7DECF; background:#F5EFE3; display:flex; align-items:center; justify-content:center; flex-shrink:0;\"><svg viewBox=\"0 0 160 60\" width=\"200\" height=\"76\"><rect x=\"14\" y=\"14\" width=\"52\" height=\"34\" fill=\"none\" stroke=\"#2F6B40\" stroke-width=\"2\" stroke-dasharray=\"5 4\"><\u002Frect><rect x=\"22\" y=\"22\" width=\"14\" height=\"14\" fill=\"#2F6B40\" style=\"animation:blink 2.4s ease-in-out infinite;\"><\u002Frect><rect x=\"42\" y=\"24\" width=\"12\" height=\"12\" fill=\"#2F6B40\" style=\"animation:blink 2.4s ease-in-out 0.5s infinite;\"><\u002Frect><rect x=\"94\" y=\"14\" width=\"52\" height=\"34\" fill=\"none\" stroke=\"#C9BEAC\" stroke-width=\"2\" stroke-dasharray=\"5 4\"><\u002Frect><rect x=\"104\" y=\"24\" width=\"12\" height=\"12\" fill=\"#C9BEAC\"><\u002Frect><rect x=\"124\" y=\"22\" width=\"12\" height=\"12\" fill=\"#C9BEAC\"><\u002Frect><\u002Fsvg><\u002Fdiv>\n      <div style=\"width:380px; font-family:'JetBrains Mono',monospace; font-size:28px; color:#2F6B40;\">islands + sleep<\u002Fdiv>\n      <div style=\"flex:1; font-size:28px; color:#4A4234; line-height:1.45; text-wrap:pretty;\">only touching groups affect each other. Groups at rest are skipped entirely.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto; font-family:'JetBrains Mono',monospace; font-size:27px; color:#6E6455;\">the shape of the work: <span style=\"color:#332C21;\">tight float loops over packed arrays<\u002Fspan>. Allocation is the enemy.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Hostile Workload\" data-speaker-notes=\"So why is this workload brutal for JavaScript specifically? Three reasons. One: it creates tons of tiny short-lived objects every single frame, contact points, scratch buffers. In JS the garbage collector eventually has to clean those up, and when it runs, it pauses your program. A pause in the middle of a frame is a visible hitch. Two: the solver reads huge arrays over and over, and CPUs are only fast when data sits next to each other in memory. JS objects are scattered all over the heap. Rust lets you control the exact layout. Three, the sneaky one: players never feel your average frame. They feel the one slow frame. So the whole game is about the worst case, not the mean. And that trio, no GC, control over memory layout, predictable worst case, is literally Rust's sales pitch.\" style=\"background:#FCFAF4; color:#332C21; font-family:'Space Grotesk',sans-serif; box-sizing:border-box; padding:90px 100px 80px 100px; display:flex; flex-direction:column; gap:56px;\">\n  <h2 style=\"margin:0; font-size:68px; font-weight:700; letter-spacing:-0.01em;\">A Hostile Workload<\u002Fh2>\n  <div style=\"display:flex; gap:40px; margin-top:20px;\">\n    <div style=\"flex:1; border:1px solid #E7DECF; background:#F5EFE3; padding:40px; display:flex; flex-direction:column; gap:26px;\">\n      <div style=\"height:80px; display:flex; align-items:flex-end; gap:8px;\">\n        <div style=\"width:26px; height:44px; background:#CFC4B0;\"><\u002Fdiv><div style=\"width:26px; height:52px; background:#CFC4B0;\"><\u002Fdiv><div style=\"width:26px; height:40px; background:#CFC4B0;\"><\u002Fdiv>\n        <div style=\"width:110px; height:64px; border:2px dashed #2F6B40; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:24px; color:#2F6B40; animation:blink 2.4s ease-in-out infinite;\">GC<\u002Fdiv>\n        <div style=\"width:26px; height:48px; background:#CFC4B0;\"><\u002Fdiv><div style=\"width:26px; height:42px; background:#CFC4B0;\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:38px; font-weight:500;\">allocation-heavy<\u002Fdiv>\n      <div style=\"font-size:27px; color:#6E6455; line-height:1.5; text-wrap:pretty;\">thousands of tiny objects per frame. In a GC'd runtime the cleanup pauses land mid-frame.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1; border:1px solid #E7DECF; background:#F5EFE3; padding:40px; display:flex; flex-direction:column; gap:26px;\">\n      <div style=\"height:80px; display:flex; flex-direction:column; justify-content:center; gap:14px;\">\n        <div style=\"display:flex; gap:6px; align-items:center;\"><span style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#2F6B40; width:70px;\">fast<\u002Fspan><span style=\"width:22px; height:22px; background:#63988F; animation:popfade 1.8s ease-in-out infinite;\"><\u002Fspan><span style=\"width:22px; height:22px; background:#63988F; animation:popfade 1.8s ease-in-out 0.15s infinite;\"><\u002Fspan><span style=\"width:22px; height:22px; background:#63988F; animation:popfade 1.8s ease-in-out 0.3s infinite;\"><\u002Fspan><span style=\"width:22px; height:22px; background:#B8AB94; animation:popfade 1.8s ease-in-out 0.45s infinite;\"><\u002Fspan><span style=\"width:22px; height:22px; background:#B8AB94; animation:popfade 1.8s ease-in-out 0.6s infinite;\"><\u002Fspan><span style=\"width:22px; height:22px; background:#B8AB94; animation:popfade 1.8s ease-in-out 0.75s infinite;\"><\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; gap:6px; align-items:center;\"><span style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#6E6455; width:70px;\">slow<\u002Fspan><span style=\"width:22px; height:22px; background:#63988F; animation:popfade 2.6s ease-in-out 1.1s infinite;\"><\u002Fspan><span style=\"width:22px; height:22px; background:#B8AB94; animation:popfade 2.6s ease-in-out 0.3s infinite;\"><\u002Fspan><span style=\"width:22px; height:22px; background:#E4D8C2; animation:popfade 2.6s ease-in-out 1.9s infinite;\"><\u002Fspan><span style=\"width:22px; height:22px; background:#B8AB94; animation:popfade 2.6s ease-in-out 0.7s infinite;\"><\u002Fspan><span style=\"width:22px; height:22px; background:#63988F; animation:popfade 2.6s ease-in-out 2.2s infinite;\"><\u002Fspan><span style=\"width:22px; height:22px; background:#E4D8C2; animation:popfade 2.6s ease-in-out 0.1s infinite;\"><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:38px; font-weight:500;\">cache-sensitive<\u002Fdiv>\n      <div style=\"font-size:27px; color:#6E6455; line-height:1.5; text-wrap:pretty;\">CPUs are fast when data sits together and is read in order. Rust controls layout, JS objects scatter.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1; border:1px solid #E7DECF; background:#F5EFE3; padding:40px; display:flex; flex-direction:column; gap:26px;\">\n      <div style=\"height:80px; display:flex; align-items:flex-end; gap:8px;\">\n        <div style=\"width:26px; height:36px; background:#CFC4B0;\"><\u002Fdiv><div style=\"width:26px; height:42px; background:#CFC4B0;\"><\u002Fdiv><div style=\"width:26px; height:38px; background:#CFC4B0;\"><\u002Fdiv><div style=\"width:26px; height:78px; background:#2F6B40; animation:blink 2.4s ease-in-out infinite;\"><\u002Fdiv><div style=\"width:26px; height:40px; background:#CFC4B0;\"><\u002Fdiv><div style=\"width:26px; height:36px; background:#CFC4B0;\"><\u002Fdiv><div style=\"width:26px; height:44px; background:#CFC4B0;\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:38px; font-weight:500;\">latency-sensitive<\u002Fdiv>\n      <div style=\"font-size:27px; color:#6E6455; line-height:1.5; text-wrap:pretty;\">players never feel the average frame. They feel the one slow frame.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto; font-family:'JetBrains Mono',monospace; font-size:28px; color:#332C21;\"><span style=\"color:#2F6B40;\">→<\u002Fspan> <span>exactly the workload Rust's value proposition was written for<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Frame Budget\" data-speaker-notes=\"Each bar is how long one frame's physics took. The dashed line is the deadline, 16.6 milliseconds. Top row is a garbage collected runtime: most frames are fine, then the collector kicks in and one frame blows past the line. That single tall bar is the stutter you feel. Bottom row is the same work in Rust compiled to WASM: no collector, memory reused frame to frame, so the bars stay level. The point is not that the average gets faster. The point is the worst case looks like the average case.\" style=\"background:#FCFAF4; color:#332C21; font-family:'Space Grotesk',sans-serif; box-sizing:border-box; padding:90px 100px 80px 100px; display:flex; flex-direction:column; gap:56px;\">\n  <h2 style=\"margin:0; font-size:68px; font-weight:700; letter-spacing:-0.01em;\">The Frame Budget<\u002Fh2>\n  <div style=\"display:flex; flex-direction:column; gap:52px; margin-top:20px;\">\n    <div style=\"display:flex; align-items:flex-end; gap:44px;\">\n      <div style=\"width:280px; display:flex; flex-direction:column; gap:10px;\"><span style=\"font-family:'JetBrains Mono',monospace; font-size:27px; color:#2F6B40;\">GC'd runtime<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#6E6455;\">per-frame time<\u002Fspan><\u002Fdiv>\n      <div style=\"flex:1; position:relative; height:250px; border-bottom:1px solid #DCD2C0;\">\n        <div style=\"position:absolute; left:0; right:0; bottom:125px; border-top:1px dashed #332C21; opacity:0.6;\"><\u002Fdiv>\n        <div style=\"position:absolute; right:0; bottom:134px; font-family:'JetBrains Mono',monospace; font-size:24px; color:#332C21;\">16.6 ms<\u002Fdiv>\n        <div style=\"position:absolute; top:0; bottom:0; width:2px; background:rgba(51,44,33,0.45); animation:sweep 7s linear infinite;\"><\u002Fdiv>\n        <div style=\"position:absolute; inset:0; display:flex; align-items:flex-end; gap:10px; padding-right:170px;\">\n          <div style=\"flex:1; height:92px; background:#CFC4B0;\"><\u002Fdiv><div style=\"flex:1; height:78px; background:#CFC4B0;\"><\u002Fdiv><div style=\"flex:1; height:104px; background:#CFC4B0;\"><\u002Fdiv><div style=\"flex:1; height:84px; background:#CFC4B0;\"><\u002Fdiv><div style=\"flex:1; height:96px; background:#CFC4B0;\"><\u002Fdiv><div style=\"flex:1; height:218px; background:#A32C24; animation:blink 2.4s ease-in-out infinite;\"><\u002Fdiv><div style=\"flex:1; height:88px; background:#CFC4B0;\"><\u002Fdiv><div style=\"flex:1; height:76px; background:#CFC4B0;\"><\u002Fdiv><div style=\"flex:1; height:98px; background:#CFC4B0;\"><\u002Fdiv><div style=\"flex:1; height:86px; background:#CFC4B0;\"><\u002Fdiv><div style=\"flex:1; height:80px; background:#CFC4B0;\"><\u002Fdiv><div style=\"flex:1; height:234px; background:#A32C24; animation:blink 2.4s ease-in-out 0.8s infinite;\"><\u002Fdiv><div style=\"flex:1; height:90px; background:#CFC4B0;\"><\u002Fdiv><div style=\"flex:1; height:80px; background:#CFC4B0;\"><\u002Fdiv><div style=\"flex:1; height:102px; background:#CFC4B0;\"><\u002Fdiv><div style=\"flex:1; height:88px; background:#CFC4B0;\"><\u002Fdiv><div style=\"flex:1; height:94px; background:#CFC4B0;\"><\u002Fdiv><div style=\"flex:1; height:206px; background:#A32C24; animation:blink 2.4s ease-in-out 1.6s infinite;\"><\u002Fdiv><div style=\"flex:1; height:84px; background:#CFC4B0;\"><\u002Fdiv><div style=\"flex:1; height:96px; background:#CFC4B0;\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:flex-end; gap:44px;\">\n      <div style=\"width:280px; display:flex; flex-direction:column; gap:10px;\"><span style=\"font-family:'JetBrains Mono',monospace; font-size:27px; color:#175E6B;\">Rust → WASM<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#6E6455;\">per-frame time<\u002Fspan><\u002Fdiv>\n      <div style=\"flex:1; position:relative; height:250px; border-bottom:1px solid #DCD2C0;\">\n        <div style=\"position:absolute; left:0; right:0; bottom:125px; border-top:1px dashed #332C21; opacity:0.6;\"><\u002Fdiv>\n        <div style=\"position:absolute; top:0; bottom:0; width:2px; background:rgba(51,44,33,0.45); animation:sweep 7s linear infinite;\"><\u002Fdiv>\n        <div style=\"position:absolute; inset:0; display:flex; align-items:flex-end; gap:10px; padding-right:170px;\">\n          <div style=\"flex:1; height:88px; background:#63988F;\"><\u002Fdiv><div style=\"flex:1; height:84px; background:#63988F;\"><\u002Fdiv><div style=\"flex:1; height:90px; background:#63988F;\"><\u002Fdiv><div style=\"flex:1; height:86px; background:#63988F;\"><\u002Fdiv><div style=\"flex:1; height:92px; background:#63988F;\"><\u002Fdiv><div style=\"flex:1; height:88px; background:#63988F;\"><\u002Fdiv><div style=\"flex:1; height:84px; background:#63988F;\"><\u002Fdiv><div style=\"flex:1; height:90px; background:#63988F;\"><\u002Fdiv><div style=\"flex:1; height:86px; background:#63988F;\"><\u002Fdiv><div style=\"flex:1; height:88px; background:#63988F;\"><\u002Fdiv><div style=\"flex:1; height:92px; background:#63988F;\"><\u002Fdiv><div style=\"flex:1; height:86px; background:#63988F;\"><\u002Fdiv><div style=\"flex:1; height:90px; background:#63988F;\"><\u002Fdiv><div style=\"flex:1; height:84px; background:#63988F;\"><\u002Fdiv><div style=\"flex:1; height:88px; background:#63988F;\"><\u002Fdiv><div style=\"flex:1; height:90px; background:#63988F;\"><\u002Fdiv><div style=\"flex:1; height:86px; background:#63988F;\"><\u002Fdiv><div style=\"flex:1; height:88px; background:#63988F;\"><\u002Fdiv><div style=\"flex:1; height:84px; background:#63988F;\"><\u002Fdiv><div style=\"flex:1; height:90px; background:#63988F;\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto; font-family:'JetBrains Mono',monospace; font-size:28px;\"><span style=\"color:#2F6B40;\">tail latency is the whole game.<\u002Fspan> <span style=\"color:#6E6455;\">The spike is the stutter.<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Enter Rapier\" data-speaker-notes=\"Quick history so the name makes sense. Browser physics used to be two options. ammo.js, which is the C++ engine Bullet squeezed through a compiler into JS. Powerful, but you end up doing manual memory management from JavaScript. Or cannon.js, hand-written JS, lovely API but a weaker solver. Nobody had built an engine designed for the compile-to-WASM world from day one. That is what Dimforge did. Sebastien Crozet had spent a decade on Rust geometry: ncollide for collision detection, nphysics for dynamics. In 2020 he rewrote them as parry and Rapier. So Rapier is not a port. It is a from-scratch Rust engine standing on ten years of Rust math libraries, nalgebra underneath.\" style=\"background:#FCFAF4; color:#332C21; font-family:'Space Grotesk',sans-serif; box-sizing:border-box; padding:90px 100px 80px 100px; display:flex; flex-direction:column; gap:52px;\">\n  <h2 style=\"margin:0; font-size:68px; font-weight:700; letter-spacing:-0.01em;\">Enter Rapier<\u002Fh2>\n  <div style=\"display:flex; align-items:baseline; gap:40px; border:1px solid #E7DECF; background:#F5EFE3; padding:28px 36px;\">\n    <span style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#6E6455; flex-shrink:0;\">before it<\u002Fspan>\n    <span style=\"font-size:27px; color:#5C5344; line-height:1.5;\">ammo.js: Bullet (C++) squeezed into JS, powerful but clunky. cannon.js: friendly, hand-written JS, weaker solver. Nothing designed for WASM from day one.<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:flex; flex-direction:column; gap:40px; margin-top:8px;\">\n    <div style=\"display:flex; align-items:center; gap:40px;\">\n      <div style=\"width:360px; font-family:'JetBrains Mono',monospace; font-size:34px; color:#6E6455; text-align:right;\">ncollide<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:34px; color:#C9BEAC;\">→<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:52px; color:#332C21;\">parry<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:25px; color:#6E6455;\">collision detection · standalone crate<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap:40px;\">\n      <div style=\"width:360px; font-family:'JetBrains Mono',monospace; font-size:34px; color:#6E6455; text-align:right;\">nphysics<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:34px; color:#C9BEAC;\">→<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:52px; color:#2F6B40;\">rapier<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:25px; color:#6E6455;\">dynamics · 2020 rewrite<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto; display:flex; align-items:center; gap:40px;\">\n    <div style=\"display:inline-flex; align-items:center; gap:22px; border:1px solid #DCD2C0; background:#F5EFE3; padding:22px 30px;\">\n      <span style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#6E6455;\">github<\u002Fspan>\n      <span style=\"width:1px; align-self:stretch; background:#DCD2C0;\"><\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace; font-size:27px; color:#332C21;\">dimforge/rapier<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#2F6B40;\">↗<\u002Fspan>\n    <\u002Fdiv>\n    <span style=\"font-family:'JetBrains Mono',monospace; font-size:25px; color:#6E6455;\">built on nalgebra · Dimforge, Sébastien Crozet<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"One Crate\" data-speaker-notes=\"Here is the part that should impress you as a Rust developer, independent of physics. This is one source tree. You do not fork it for 2D, you do not fork it for double precision, you do not fork it for the browser. Those are Cargo feature flags. Flip dim2 or dim3 and the same solver code compiles for either. Flip f64 for scientific precision. On native you can turn on SIMD and rayon parallelism. And the same crate compiles through wasm-bindgen into an npm package that browser people install without knowing any Rust. One codebase, tested once, shipped to every platform. Most C++ engines maintain separate builds and separate bindings for a fraction of this matrix.\" style=\"background:#FCFAF4; color:#332C21; font-family:'Space Grotesk',sans-serif; box-sizing:border-box; padding:90px 100px 80px 100px; display:flex; flex-direction:column; gap:52px;\">\n  <h2 style=\"margin:0; font-size:68px; font-weight:700; letter-spacing:-0.01em;\">One Crate, Every Platform<\u002Fh2>\n  <div style=\"display:flex; align-items:center; gap:48px; margin-top:16px;\">\n    <div style=\"width:560px; border:1px solid #2F6B40; background:rgba(47,107,64,0.05); padding:40px 44px; display:flex; flex-direction:column; gap:26px;\">\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#6E6455;\">one source tree<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:42px; color:#2F6B40;\">rapier/src<\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; gap:12px;\">\n        <span style=\"border:1px solid #DCD2C0; background:#F5EFE3; padding:10px 18px; font-family:'JetBrains Mono',monospace; font-size:24px; color:#5C5344;\">dim2 | dim3<\u002Fspan>\n        <span style=\"border:1px solid #DCD2C0; background:#F5EFE3; padding:10px 18px; font-family:'JetBrains Mono',monospace; font-size:24px; color:#5C5344;\">f32 | f64<\u002Fspan>\n        <span style=\"border:1px solid #DCD2C0; background:#F5EFE3; padding:10px 18px; font-family:'JetBrains Mono',monospace; font-size:24px; color:#5C5344;\">simd<\u002Fspan>\n        <span style=\"border:1px solid #DCD2C0; background:#F5EFE3; padding:10px 18px; font-family:'JetBrains Mono',monospace; font-size:24px; color:#5C5344;\">parallel<\u002Fspan>\n        <span style=\"border:1px solid #DCD2C0; background:#F5EFE3; padding:10px 18px; font-family:'JetBrains Mono',monospace; font-size:24px; color:#5C5344;\">enhanced-determinism<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-size:26px; color:#6E6455; line-height:1.45;\">cargo feature flags, not forks<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column; gap:8px; align-items:center;\">\n      <span style=\"font-family:'JetBrains Mono',monospace; font-size:36px; color:#C9BEAC;\">→<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#6E6455;\">compiles to<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1; display:flex; flex-direction:column; gap:22px;\">\n      <div style=\"border:1px solid #DCD2C0; background:#F5EFE3; padding:28px 36px; display:flex; align-items:baseline; gap:28px;\">\n        <span style=\"font-family:'JetBrains Mono',monospace; font-size:30px; color:#332C21;\">rapier3d<\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#2F6B40;\">crates.io<\u002Fspan>\n        <span style=\"font-size:25px; color:#6E6455;\">native games, rayon + SIMD<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #DCD2C0; background:#F5EFE3; padding:28px 36px; display:flex; align-items:baseline; gap:28px;\">\n        <span style=\"font-family:'JetBrains Mono',monospace; font-size:30px; color:#332C21;\">rapier3d-f64<\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#2F6B40;\">crates.io<\u002Fspan>\n        <span style=\"font-size:25px; color:#6E6455;\">double precision, sims and robotics<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #175E6B; background:rgba(31,116,132,0.05); padding:28px 36px; display:flex; align-items:baseline; gap:28px;\">\n        <span style=\"font-family:'JetBrains Mono',monospace; font-size:30px; color:#175E6B;\">@dimforge/rapier3d<\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#2F6B40;\">npm<\u002Fspan>\n        <span style=\"font-size:25px; color:#6E6455;\">the browser, via wasm-bindgen<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto; font-family:'JetBrains Mono',monospace; font-size:27px; color:#6E6455;\">same physics everywhere, <span style=\"color:#332C21;\">chosen at compile time<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Three Wins\" data-speaker-notes=\"Three things Rapier gives you that are genuinely rare, and none of them are fancy solver math. One: flat frame times. No garbage collector, memory arenas reused every frame, so the worst frame looks like the average frame. Two: determinism as a feature flag. Turn on enhanced-determinism and the same inputs produce bit-for-bit the same results on every platform. Most engines cannot promise this at all, because float math normally varies subtly across CPUs and compilers. Three: the entire physics world is serializable with serde. You can snapshot everything to bytes, save it, send it, restore it. That makes save games, rollback netcode and time-travel debugging almost free. Try asking PhysX to hand you its complete internal state.\" style=\"background:#FCFAF4; color:#332C21; font-family:'Space Grotesk',sans-serif; box-sizing:border-box; padding:90px 100px 80px 100px; display:flex; flex-direction:column; gap:56px;\">\n  <h2 style=\"margin:0; font-size:68px; font-weight:700; letter-spacing:-0.01em;\">Three Wins<\u002Fh2>\n  <div style=\"display:flex; gap:40px; margin-top:20px;\">\n    <div style=\"flex:1; border:1px solid #E7DECF; background:#F5EFE3; padding:40px; display:flex; flex-direction:column; gap:26px;\">\n      <div style=\"height:110px; position:relative; display:flex; align-items:flex-end; gap:7px; border-bottom:1px solid #E7DECF;\">\n        <div style=\"position:absolute; left:0; right:0; bottom:74px; border-top:1px dashed #2F6B40;\"><\u002Fdiv>\n        <div style=\"position:absolute; top:0; bottom:0; width:2px; background:rgba(51,44,33,0.35); animation:sweep 5s linear infinite;\"><\u002Fdiv>\n        <div style=\"flex:1; height:46px; background:#63988F;\"><\u002Fdiv><div style=\"flex:1; height:50px; background:#63988F;\"><\u002Fdiv><div style=\"flex:1; height:44px; background:#63988F;\"><\u002Fdiv><div style=\"flex:1; height:48px; background:#63988F;\"><\u002Fdiv><div style=\"flex:1; height:46px; background:#63988F;\"><\u002Fdiv><div style=\"flex:1; height:50px; background:#63988F;\"><\u002Fdiv><div style=\"flex:1; height:46px; background:#63988F;\"><\u002Fdiv><div style=\"flex:1; height:48px; background:#63988F;\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:25px; color:#2F6B40;\">01<\u002Fdiv>\n      <div style=\"font-size:40px; font-weight:500;\">Flat frame times<\u002Fdiv>\n      <div style=\"font-size:27px; color:#6E6455; line-height:1.5; text-wrap:pretty;\">no GC, arena storage, packed arrays. The worst case looks like the average case.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1; border:1px solid #E7DECF; background:#F5EFE3; padding:40px; display:flex; flex-direction:column; gap:26px;\">\n      <div style=\"height:110px; display:flex; align-items:center; justify-content:center; gap:20px;\">\n        <svg viewBox=\"0 0 60 60\" width=\"84\" height=\"84\"><rect x=\"8\" y=\"40\" width=\"44\" height=\"4\" fill=\"#B8AB94\"><\u002Frect><rect x=\"14\" y=\"24\" width=\"12\" height=\"16\" fill=\"#2F6B40\"><\u002Frect><rect x=\"34\" y=\"16\" width=\"8\" height=\"24\" fill=\"#B8AB94\"><\u002Frect><\u002Fsvg>\n        <span style=\"font-family:'JetBrains Mono',monospace; font-size:34px; color:#175E6B; animation:blink 2.4s ease-in-out infinite;\">=<\u002Fspan>\n        <svg viewBox=\"0 0 60 60\" width=\"84\" height=\"84\"><rect x=\"8\" y=\"40\" width=\"44\" height=\"4\" fill=\"#B8AB94\"><\u002Frect><rect x=\"14\" y=\"24\" width=\"12\" height=\"16\" fill=\"#2F6B40\"><\u002Frect><rect x=\"34\" y=\"16\" width=\"8\" height=\"24\" fill=\"#B8AB94\"><\u002Frect><\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:25px; color:#2F6B40;\">02<\u002Fdiv>\n      <div style=\"font-size:40px; font-weight:500;\">Determinism, as a flag<\u002Fdiv>\n      <div style=\"font-size:27px; color:#6E6455; line-height:1.5; text-wrap:pretty;\">enhanced-determinism: same inputs, bit-for-bit same results, on every platform. Most engines cannot promise this at all.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1; border:1px solid #E7DECF; background:#F5EFE3; padding:40px; display:flex; flex-direction:column; gap:26px;\">\n      <div style=\"height:110px; display:flex; align-items:center; justify-content:center; gap:20px;\">\n        <svg viewBox=\"0 0 60 60\" width=\"84\" height=\"84\"><rect x=\"12\" y=\"12\" width=\"36\" height=\"36\" fill=\"none\" stroke=\"#5C5344\" stroke-width=\"2.5\"><\u002Frect><rect x=\"22\" y=\"22\" width=\"16\" height=\"16\" fill=\"#63988F\"><\u002Frect><\u002Fsvg>\n        <span style=\"font-family:'JetBrains Mono',monospace; font-size:30px; color:#6E6455;\">⇄<\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace; font-size:32px; color:#175E6B; animation:blink 2.6s ease-in-out infinite;\">{ .bin }<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:25px; color:#2F6B40;\">03<\u002Fdiv>\n      <div style=\"font-size:40px; font-weight:500;\">A serializable world<\u002Fdiv>\n      <div style=\"font-size:27px; color:#6E6455; line-height:1.5; text-wrap:pretty;\">serde snapshots of the full state. Save, restore, rollback netcode, time-travel debugging.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"What WASM Gives\" data-speaker-notes=\"Why WASM specifically, and not just fast JS? Four reasons. It is compiled ahead of time, so the float loops run at a steady near-native speed, no JIT warming up and no sudden deoptimization mid-jump. Its memory is one flat buffer called linear memory, so Rapier's packed arrays survive exactly as designed, and JS can look straight into that buffer through a typed array without copying anything. There is no garbage collector in the loop at all. And the one people miss: WASM pins down float semantics. IEEE 754, for the noobs in the room including past me, is the universal standard for how computers store and round decimal numbers in binary. Every platform claims to follow it, but compilers and CPUs are allowed little liberties natively, fused operations, extended precision, so the same code can give slightly different bits on different machines. WASM forbids those liberties. That is why the determinism flag can actually hold in the browser.\" style=\"background:#FCFAF4; color:#332C21; font-family:'Space Grotesk',sans-serif; box-sizing:border-box; padding:90px 100px 80px 100px; display:flex; flex-direction:column; gap:48px;\">\n  <h2 style=\"margin:0; font-size:68px; font-weight:700; letter-spacing:-0.01em;\">What WASM Gives You<\u002Fh2>\n  <div style=\"display:flex; flex-direction:column;\">\n    <div style=\"display:flex; align-items:baseline; gap:48px; padding:34px 0; border-bottom:1px solid #E7DECF;\">\n      <div style=\"width:460px; font-family:'JetBrains Mono',monospace; font-size:30px; color:#175E6B;\">near-native codegen<\u002Fdiv>\n      <div style=\"flex:1; font-size:29px; color:#4A4234; line-height:1.45; text-wrap:pretty;\">compiled ahead of time. No JIT warm-up, no deopt cliff in the middle of a jump.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:baseline; gap:48px; padding:34px 0; border-bottom:1px solid #E7DECF;\">\n      <div style=\"width:460px; font-family:'JetBrains Mono',monospace; font-size:30px; color:#175E6B;\">linear memory<\u002Fdiv>\n      <div style=\"flex:1; font-size:29px; color:#4A4234; line-height:1.45; text-wrap:pretty;\">one flat buffer. Arenas and packed arrays survive intact, and JS reads transforms through typed-array views, zero copies.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:baseline; gap:48px; padding:34px 0; border-bottom:1px solid #E7DECF;\">\n      <div style=\"width:460px; font-family:'JetBrains Mono',monospace; font-size:30px; color:#175E6B;\">no GC in the loop<\u002Fdiv>\n      <div style=\"flex:1; font-size:29px; color:#4A4234; line-height:1.45; text-wrap:pretty;\">Rust ownership inside, integer handles outside. Nothing for the collector to trace, nothing to pause.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:baseline; gap:48px; padding:34px 0;\">\n      <div style=\"width:460px; font-family:'JetBrains Mono',monospace; font-size:30px; color:#175E6B;\">pinned float semantics<\u002Fdiv>\n      <div style=\"flex:1; font-size:29px; color:#4A4234; line-height:1.45; text-wrap:pretty;\">IEEE 754 behavior is part of the WASM spec. The determinism flag holds on the web, not just natively.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto; font-family:'JetBrains Mono',monospace; font-size:27px; color:#6E6455;\">WASM is not a porting tax here. <span style=\"color:#332C21;\">It is the platform the engine was designed for.<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"WASM Boundary\" data-speaker-notes=\"Every JS to WASM call has overhead, like a border crossing. The naive design asks WASM for each object's position every frame. A thousand objects, sixty frames, that is sixty thousand crossings a second, and the overhead eats the budget. Rapier's design: the world never leaves WASM. JavaScript only holds handles, which are just numbers, an index plus a generation counter. If a body got deleted and its slot reused, the generation will not match and the stale handle fails safely instead of pointing at the wrong thing. This is the slotmap pattern many of you already use, promoted to the FFI contract, and it works across the boundary precisely because a handle is just integers. Per frame exactly one call crosses: world.step(). Then JS reads all the transforms back in one bulk typed-array view. Two crossings total, no matter how many objects.\" style=\"background:#FCFAF4; color:#332C21; font-family:'Space Grotesk',sans-serif; box-sizing:border-box; padding:90px 100px 80px 100px; display:flex; flex-direction:column; gap:44px;\">\n  <h2 style=\"margin:0; font-size:68px; font-weight:700; letter-spacing:-0.01em;\">The WASM Boundary<\u002Fh2>\n  <div style=\"display:flex; align-items:center; gap:36px; border:1px solid #E7DECF; background:#F5EFE3; padding:24px 36px;\">\n    <span style=\"font-family:'JetBrains Mono',monospace; font-size:28px; color:#2F6B40;\">✕<\u002Fspan>\n    <span style=\"font-family:'JetBrains Mono',monospace; font-size:26px; color:#A89B85; text-decoration:line-through;\">js ⇄ wasm ⇄ js ⇄ wasm ⇄ js ⇄ wasm, per object, per frame<\u002Fspan>\n    <span style=\"font-size:26px; color:#6E6455;\">the trap: a thousand tiny border crossings eat the budget<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:flex; align-items:stretch; gap:0;\">\n    <div style=\"flex:1; border:1px solid #DCD2C0; background:#F5EFE3; padding:40px; display:flex; flex-direction:column; gap:26px;\">\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:25px; color:#6E6455;\">JS · holds handles<\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; gap:14px;\">\n        <span style=\"border:1px solid #C9BEAC; padding:12px 20px; font-family:'JetBrains Mono',monospace; font-size:25px; color:#332C21;\">(0, gen 2)<\u002Fspan>\n        <span style=\"border:1px solid #2F6B40; padding:12px 20px; font-family:'JetBrains Mono',monospace; font-size:25px; color:#2F6B40; animation:blink 2.8s ease-in-out infinite;\">(2, gen 5)<\u002Fspan>\n        <span style=\"border:1px solid #C9BEAC; padding:12px 20px; font-family:'JetBrains Mono',monospace; font-size:25px; color:#332C21;\">(4, gen 1)<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-size:26px; color:#6E6455; line-height:1.5; text-wrap:pretty;\">just numbers: slot index + generation. A stale handle mismatches and fails safely.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"width:420px; position:relative; display:flex; flex-direction:column; justify-content:center; gap:38px;\">\n      <div style=\"position:absolute; left:50%; top:-10px; bottom:-10px; border-left:2px dashed #C9BEAC;\"><\u002Fdiv>\n      <div style=\"position:relative; align-self:center; background:#FCFAF4; padding:10px 18px; font-family:'JetBrains Mono',monospace; font-size:26px; color:#2F6B40; animation:nudger 2s ease-in-out infinite;\">world.step() ⟶<\u002Fdiv>\n      <div style=\"position:relative; align-self:center; background:#FCFAF4; padding:10px 18px; font-family:'JetBrains Mono',monospace; font-size:26px; color:#6E6455; animation:nudgel 2s ease-in-out 1s infinite;\">⟵ one bulk view<\u002Fdiv>\n      <div style=\"position:relative; align-self:center; background:#FCFAF4; padding:6px 18px; font-family:'JetBrains Mono',monospace; font-size:24px; color:#A89B85;\">2 crossings / frame<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1; border:1px solid #175E6B; background:rgba(31,116,132,0.05); padding:40px; display:flex; flex-direction:column; gap:26px;\">\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:25px; color:#175E6B;\">WASM · owns the world<\u002Fdiv>\n      <div style=\"display:flex; gap:8px;\">\n        <span style=\"flex:1; border:1px solid #C9BEAC; background:#F5EFE3; padding:10px 0; text-align:center; font-family:'JetBrains Mono',monospace; font-size:24px; color:#5C5344;\">g2<\u002Fspan>\n        <span style=\"flex:1; border:1px solid #C9BEAC; background:#F5EFE3; padding:10px 0; text-align:center; font-family:'JetBrains Mono',monospace; font-size:24px; color:#5C5344;\">g0<\u002Fspan>\n        <span style=\"flex:1; border:1px solid #2F6B40; background:rgba(47,107,64,0.06); padding:10px 0; text-align:center; font-family:'JetBrains Mono',monospace; font-size:24px; color:#2F6B40; animation:blink 2.8s ease-in-out infinite;\">g5<\u002Fspan>\n        <span style=\"flex:1; border:1px dashed #C9BEAC; padding:10px 0; text-align:center; font-family:'JetBrains Mono',monospace; font-size:24px; color:#C9BEAC;\">free<\u002Fspan>\n        <span style=\"flex:1; border:1px solid #C9BEAC; background:#F5EFE3; padding:10px 0; text-align:center; font-family:'JetBrains Mono',monospace; font-size:24px; color:#5C5344;\">g1<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:12px;\">\n        <div style=\"display:flex; align-items:center; gap:18px;\"><span style=\"width:100px; font-family:'JetBrains Mono',monospace; font-size:25px; color:#332C21;\">pos[]<\u002Fspan><span style=\"flex:1; height:16px; background:repeating-linear-gradient(90deg, #63988F 0 26px, #E4DCCB 26px 30px);\"><\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:18px;\"><span style=\"width:100px; font-family:'JetBrains Mono',monospace; font-size:25px; color:#332C21;\">rot[]<\u002Fspan><span style=\"flex:1; height:16px; background:repeating-linear-gradient(90deg, #63988F 0 26px, #E4DCCB 26px 30px);\"><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:26px; color:#6E6455; line-height:1.5; text-wrap:pretty;\">arena slots + packed arrays, living in linear memory permanently<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto; font-family:'JetBrains Mono',monospace; font-size:27px; color:#6E6455;\">state stays inside. <span style=\"color:#332C21;\">Only numbers cross the wall.<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"API in Practice\" data-speaker-notes=\"What that design feels like to use. Left panel is the entire JS surface for a falling crate: make a world, make a body, attach a collider, then once per frame call step and read the position back. Notice body is a handle underneath, you never hold a physics object in JS. Right panel is the React wrapper, react-three-rapier, which is what Helicon's components emit. Same handles, wrapped declaratively. And the takeaway for your own crates, whatever domain you work in: keep state inside WASM, hand out handles, batch the boundary into one call, and derive serde on everything so state can leave when you want it to, not accidentally.\" style=\"background:#FCFAF4; color:#332C21; font-family:'Space Grotesk',sans-serif; box-sizing:border-box; padding:90px 100px 80px 100px; display:flex; flex-direction:column; gap:52px;\">\n  <h2 style=\"margin:0; font-size:68px; font-weight:700; letter-spacing:-0.01em;\">The API in Practice<\u002Fh2>\n  <div style=\"display:flex; gap:40px; margin-top:10px;\">\n    <div style=\"flex:1.15; border:1px solid #2A251D; background:#322B22; padding:36px 40px; display:flex; flex-direction:column; gap:22px; min-width:0;\">\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#9C8F79;\">@dimforge/rapier3d<\u002Fdiv>\n      <pre style=\"margin:0; font-family:'JetBrains Mono',monospace; font-size:24px; line-height:1.7; color:#F2ECDF; overflow:hidden;\">const gravity = { x: 0, y: -9.81, z: 0 };\nconst world = new RAPIER.World(gravity);\nconst body = world.createRigidBody(\n  RAPIER.RigidBodyDesc.dynamic());\nworld.createCollider(\n  RAPIER.ColliderDesc.cuboid(.5, .5, .5), body);\nworld.step();  <span style=\"color:#9CC98F;\">// once per frame<\u002Fspan>\nconst t = body.translation();<\u002Fpre>\n    <\u002Fdiv>\n    <div style=\"flex:1; border:1px solid #2A251D; background:#322B22; padding:36px 40px; display:flex; flex-direction:column; gap:22px; min-width:0;\">\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#9C8F79;\">@react-three/rapier<\u002Fdiv>\n      <pre style=\"margin:0; font-family:'JetBrains Mono',monospace; font-size:24px; line-height:1.7; color:#F2ECDF; overflow:hidden;\">&lt;RigidBody type=\"fixed\" colliders={false}&gt;\n  &lt;CuboidCollider\n    args={[w / 2, h / 2, d / 2]} /&gt;\n&lt;/RigidBody&gt;<\u002Fpre>\n      <div style=\"margin-top:auto; display:inline-flex; align-items:center; gap:18px; border:1px solid #4A4234; padding:16px 22px; align-self:flex-start;\">\n        <span style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#9C8F79;\">github<\u002Fspan>\n        <span style=\"width:1px; align-self:stretch; background:#4A4234;\"><\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#F2ECDF;\">pmndrs/react-three-rapier<\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#9CC98F;\">↗<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto; font-family:'JetBrains Mono',monospace; font-size:28px;\"><span style=\"color:#2F6B40;\">for your own crate:<\u002Fspan> <span style=\"color:#332C21;\">arena + handles · bat
