ch the boundary · serde everything<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Comparison\" data-speaker-notes=\"Being honest, because Rapier does not win every column. Avian, formerly bevy_xpbd, is built natively for the Bevy game engine, components are the API, and if you are all-in on Bevy it is genuinely lovely. The bindings route, physx-rs from Embark or the Jolt bindings, buys you AAA features like vehicles and cloth, at the cost of FFI to C++ and basically no browser story. Outside Rust: Jolt is arguably the strongest pure rigid-body engine today, it shipped Horizon Forbidden West. PhysX has GPU acceleration and vehicles. Box2D is the 2D gold standard, and rapier2d is its Rust-native answer. And the fine print in Rapier's own column: no soft bodies, no cloth, no vehicles, fluids live in a sibling crate called salva, no GPU solver, and giant piles of boxes will run faster in Jolt. The pitch is not fastest engine alive. It is the only one offering portability, determinism and serializability in pure Rust, as a package.\" style=\"background:#FCFAF4; color:#332C21; font-family:'Space Grotesk',sans-serif; box-sizing:border-box; padding:80px 100px 70px 100px; display:flex; flex-direction:column; gap:40px;\">\n  <h2 style=\"margin:0; font-size:64px; font-weight:700; letter-spacing:-0.01em;\">The Honest Comparison<\u002Fh2>\n  <table style=\"border-collapse:collapse; width:100%; font-size:26px;\">\n    <thead>\n      <tr>\n        <th style=\"text-align:left; padding:14px 24px; font-family:'JetBrains Mono',monospace; font-size:24px; font-weight:400; color:#6E6455; border-bottom:1px solid #DCD2C0;\"><\u002Fth>\n        <th style=\"text-align:left; padding:14px 24px; font-family:'JetBrains Mono',monospace; font-size:27px; font-weight:700; color:#2F6B40; border-bottom:1px solid #DCD2C0; background:rgba(47,107,64,0.07);\">rapier<\u002Fth>\n        <th style=\"text-align:left; padding:14px 24px; font-family:'JetBrains Mono',monospace; font-size:27px; font-weight:700; color:#332C21; border-bottom:1px solid #DCD2C0;\">avian<\u002Fth>\n        <th style=\"text-align:left; padding:14px 24px; font-family:'JetBrains Mono',monospace; font-size:27px; font-weight:700; color:#332C21; border-bottom:1px solid #DCD2C0;\">physx-rs / jolt<\u002Fth>\n      <\u002Ftr>\n    <\u002Fthead>\n    <tbody>\n      <tr>\n        <td style=\"padding:14px 24px; color:#6E6455; border-bottom:1px solid #E7DECF; font-family:'JetBrains Mono',monospace; font-size:24px;\">what it is<\u002Ftd>\n        <td style=\"padding:14px 24px; border-bottom:1px solid #E7DECF; background:rgba(47,107,64,0.07);\">standalone engine (Dimforge)<\u002Ftd>\n        <td style=\"padding:14px 24px; border-bottom:1px solid #E7DECF; color:#5C5344;\">ECS-native, for Bevy<\u002Ftd>\n        <td style=\"padding:14px 24px; border-bottom:1px solid #E7DECF; color:#5C5344;\">bindings to C++ engines<\u002Ftd>\n      <\u002Ftr>\n      <tr>\n        <td style=\"padding:14px 24px; color:#6E6455; border-bottom:1px solid #E7DECF; font-family:'JetBrains Mono',monospace; font-size:24px;\">solver<\u002Ftd>\n        <td style=\"padding:14px 24px; border-bottom:1px solid #E7DECF; background:rgba(47,107,64,0.07);\">impulse-based<\u002Ftd>\n        <td style=\"padding:14px 24px; border-bottom:1px solid #E7DECF; color:#5C5344;\">XPBD (position-based)<\u002Ftd>\n        <td style=\"padding:14px 24px; border-bottom:1px solid #E7DECF; color:#5C5344;\">the C++ engine's<\u002Ftd>\n      <\u002Ftr>\n      <tr>\n        <td style=\"padding:14px 24px; color:#6E6455; border-bottom:1px solid #E7DECF; font-family:'JetBrains Mono',monospace; font-size:24px;\">integration<\u002Ftd>\n        <td style=\"padding:14px 24px; border-bottom:1px solid #E7DECF; background:rgba(47,107,64,0.07);\">bevy_rapier, JS, anything<\u002Ftd>\n        <td style=\"padding:14px 24px; border-bottom:1px solid #E7DECF; color:#5C5344;\">components are the API<\u002Ftd>\n        <td style=\"padding:14px 24px; border-bottom:1px solid #E7DECF; color:#5C5344;\">engine-specific<\u002Ftd>\n      <\u002Ftr>\n      <tr>\n        <td style=\"padding:14px 24px; color:#6E6455; border-bottom:1px solid #E7DECF; font-family:'JetBrains Mono',monospace; font-size:24px;\">determinism<\u002Ftd>\n        <td style=\"padding:14px 24px; border-bottom:1px solid #E7DECF; background:rgba(47,107,64,0.07);\">feature flag, cross-platform<\u002Ftd>\n        <td style=\"padding:14px 24px; border-bottom:1px solid #E7DECF; color:#5C5344;\">not a headline goal<\u002Ftd>\n        <td style=\"padding:14px 24px; border-bottom:1px solid #E7DECF; color:#5C5344;\">no<\u002Ftd>\n      <\u002Ftr>\n      <tr>\n        <td style=\"padding:14px 24px; color:#6E6455; border-bottom:1px solid #E7DECF; font-family:'JetBrains Mono',monospace; font-size:24px;\">wasm<\u002Ftd>\n        <td style=\"padding:14px 24px; border-bottom:1px solid #E7DECF; background:rgba(47,107,64,0.07);\">first-class<\u002Ftd>\n        <td style=\"padding:14px 24px; border-bottom:1px solid #E7DECF; color:#5C5344;\">works, via Bevy<\u002Ftd>\n        <td style=\"padding:14px 24px; border-bottom:1px solid #E7DECF; color:#5C5344;\">painful → no<\u002Ftd>\n      <\u002Ftr>\n      <tr>\n        <td style=\"padding:14px 24px; color:#6E6455; font-family:'JetBrains Mono',monospace; font-size:24px;\">pick when<\u002Ftd>\n        <td style=\"padding:14px 24px; background:rgba(47,107,64,0.07);\">portability · determinism · web<\u002Ftd>\n        <td style=\"padding:14px 24px; color:#5C5344;\">all-in on Bevy<\u002Ftd>\n        <td style=\"padding:14px 24px; color:#5C5344;\">AAA features, accept FFI<\u002Ftd>\n      <\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <div style=\"margin-top:auto; display:flex; flex-direction:column; gap:14px;\">\n    <div style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#6E6455;\"><span style=\"color:#2F6B40;\">✕<\u002Fspan> no soft bodies, cloth, vehicles (fluids: salva) · <span style=\"color:#2F6B40;\">✕<\u002Fspan> no GPU solver · <span style=\"color:#2F6B40;\">✕<\u002Fspan> huge piles trail Jolt<\u002Fdiv>\n    <div style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#6E6455;\">the pitch: <span style=\"color:#332C21;\">portability × determinism × serializability × pure Rust<\u002Fspan>. Outside Rust: Jolt · PhysX · Bullet · Box2D<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Pure Functions\" data-speaker-notes=\"Notice the pattern hiding in everything so far. A pure function means same inputs, same output, no surprises, no hidden state. With the determinism flag on, Rapier's step is effectively pure: give it a world state and a time step, you get exactly one possible next state, bit for bit, on any machine. Once I saw the simulation that way, the question became obvious: why should generating the world be any less disciplined? If stepping the world is a pure function, building the world should be one too. That idea is Runek.\" style=\"background:#FCFAF4; color:#332C21; font-family:'Space Grotesk',sans-serif; box-sizing:border-box; padding:90px 100px 80px 100px; display:flex; flex-direction:column; gap:56px;\">\n  <h2 style=\"margin:0; font-size:68px; font-weight:700; letter-spacing:-0.01em;\">Pure Functions All the Way Down<\u002Fh2>\n  <div style=\"display:flex; flex-direction:column; gap:36px; margin-top:20px;\">\n    <div style=\"border:1px solid #DCD2C0; background:#F5EFE3; padding:44px 52px; display:flex; align-items:center; gap:48px;\">\n      <div style=\"width:280px; font-family:'JetBrains Mono',monospace; font-size:25px; color:#2F6B40;\">rapier, simulating<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:36px; color:#332C21;\">step(state, dt) → state′<\u002Fdiv>\n      <div style=\"font-size:26px; color:#6E6455; line-height:1.45; flex:1; text-wrap:pretty;\">same state in, same state out. Bit for bit, on any machine.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #DCD2C0; background:#F5EFE3; padding:44px 52px; display:flex; align-items:center; gap:48px;\">\n      <div style=\"width:280px; font-family:'JetBrains Mono',monospace; font-size:25px; color:#2F6B40;\">runek, generating<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:36px; color:#332C21;\">component(props, seed) → world<\u002Fdiv>\n      <div style=\"font-size:26px; color:#6E6455; line-height:1.45; flex:1; text-wrap:pretty;\">same props and seed in, same meshes and colliders out.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto; font-family:'JetBrains Mono',monospace; font-size:28px; color:#6E6455;\">if simulation is pure and generation is pure, <span style=\"color:#332C21;\">the whole world is reproducible<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Runek\" data-speaker-notes=\"Runek in one slide. Think shadcn, but for 3D objects. There is a registry of components. You run the CLI, it copies the actual source code of a bookshelf into your repo, and from then on you own it. Each component is a pure function: give it props and a seed, it returns meshes for the renderer and colliders for Rapier. No 3D asset files, no downloads, no server. A whole world is just one JSON file, a list of entries like the one on the right: which component, what seed, what props, where. Helicon, the world you walked around in, is about a dozen components and one file like this.\" style=\"background:#FCFAF4; color:#332C21; font-family:'Space Grotesk',sans-serif; box-sizing:border-box; padding:90px 100px 80px 100px; display:flex; flex-direction:column; gap:52px;\">\n  <h2 style=\"margin:0; font-size:68px; font-weight:700; letter-spacing:-0.01em;\">Runek: Worlds from Pure Functions<\u002Fh2>\n  <div style=\"display:flex; gap:60px; margin-top:10px;\">\n    <div style=\"flex:1; display:flex; flex-direction:column; gap:38px;\">\n      <div style=\"display:flex; gap:28px; align-items:baseline;\"><span style=\"font-family:'JetBrains Mono',monospace; font-size:26px; color:#2F6B40;\">01<\u002Fspan><span style=\"font-size:31px; line-height:1.45; color:#4A4234;\">a component is a pure function: <span style=\"font-family:'JetBrains Mono',monospace; font-size:28px; color:#332C21;\">(props, seed) → meshes + colliders<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:28px; align-items:baseline;\"><span style=\"font-family:'JetBrains Mono',monospace; font-size:26px; color:#2F6B40;\">02<\u002Fspan><span style=\"font-size:31px; line-height:1.45; color:#4A4234;\">registry, vendored: <span style=\"font-family:'JetBrains Mono',monospace; font-size:28px; color:#332C21;\">npx @runek/cli add bookshelf<\u002Fspan> drops the source in your repo<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:28px; align-items:baseline;\"><span style=\"font-family:'JetBrains Mono',monospace; font-size:26px; color:#2F6B40;\">03<\u002Fspan><span style=\"font-size:31px; line-height:1.45; color:#4A4234;\">a world is one JSON file: component refs, props, seeds. No assets, no server.<\u002Fspan><\u002Fdiv>\n      <div style=\"margin-top:auto; display:inline-flex; align-items:center; gap:22px; border:1px solid #DCD2C0; background:#F5EFE3; padding:22px 30px; align-self:flex-start;\">\n        <span style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#6E6455;\">github<\u002Fspan>\n        <span style=\"width:1px; align-self:stretch; background:#DCD2C0;\"><\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace; font-size:27px; color:#332C21;\">nullorder/runek<\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#2F6B40;\">↗<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"width:640px; border:1px solid #2A251D; background:#322B22; padding:40px 44px; display:flex; flex-direction:column; gap:24px;\">\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#9C8F79;\">world.json · one entry<\u002Fdiv>\n      <pre style=\"margin:0; font-family:'JetBrains Mono',monospace; font-size:27px; line-height:1.75; color:#F2ECDF;\">{\n  <span style=\"color:#9CC98F;\">\"component\"<\u002Fspan>: \"house\",\n  <span style=\"color:#9CC98F;\">\"seed\"<\u002Fspan>: 42,\n  <span style=\"color:#9CC98F;\">\"props\"<\u002Fspan>: { \"floors\": 2 },\n  <span style=\"color:#9CC98F;\">\"position\"<\u002Fspan>: [4, 0, 2]\n}<\u002Fpre>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto; font-family:'JetBrains Mono',monospace; font-size:27px; color:#6E6455;\">every mesh and every collider in Helicon <span style=\"color:#332C21;\">derives from entries like this one<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Colliders vs Meshes\" data-speaker-notes=\"Back to the debug view for the one discipline that keeps this fast. The bookshelf you bumped into has forty individually rendered books. Physics sees exactly one box. The rule Runek components follow: the number of colliders scales with gameplay surface, the things you can stand on or bump into, never with visual detail. The renderer happily draws thousands of instanced meshes, that is what GPUs are for. The physics world stays lean, and that is what keeps us inside the 16.6 millisecond budget from earlier.\" style=\"background:#FCFAF4; color:#332C21; font-family:'Space Grotesk',sans-serif; box-sizing:border-box; padding:90px 100px 80px 100px; display:flex; flex-direction:column; gap:52px;\">\n  <h2 style=\"margin:0; font-size:68px; font-weight:700; letter-spacing:-0.01em;\">Forty Books, One Cuboid<\u002Fh2>\n  <div style=\"display:flex; gap:40px; margin-top:10px; justify-content:center;\">\n    <div style=\"display:flex; flex-direction:column; gap:24px; align-items:center;\">\n      <div style=\"width:520px; height:420px; border:1px solid #DCD2C0; background:#F5EFE3; padding:30px; box-sizing:border-box;\"><svg viewBox=\"0 0 120 100\" width=\"100%\" height=\"100%\"><rect x=\"10\" y=\"6\" width=\"100\" height=\"88\" fill=\"none\" stroke=\"#C9BEAC\" stroke-width=\"2\"><\u002Frect><rect x=\"10\" y=\"34\" width=\"100\" height=\"2\" fill=\"#C9BEAC\"><\u002Frect><rect x=\"10\" y=\"64\" width=\"100\" height=\"2\" fill=\"#C9BEAC\"><\u002Frect><rect x=\"16\" y=\"12\" width=\"7\" height=\"20\" fill=\"#B8AB94\"><\u002Frect><rect x=\"25\" y=\"14\" width=\"6\" height=\"18\" fill=\"#2F6B40\"><\u002Frect><rect x=\"33\" y=\"12\" width=\"8\" height=\"20\" fill=\"#B8AB94\"><\u002Frect><rect x=\"43\" y=\"16\" width=\"6\" height=\"16\" fill=\"#63988F\"><\u002Frect><rect x=\"51\" y=\"12\" width=\"7\" height=\"20\" fill=\"#B8AB94\"><\u002Frect><rect x=\"60\" y=\"14\" width=\"6\" height=\"18\" fill=\"#B8AB94\"><\u002Frect><rect x=\"68\" y=\"12\" width=\"8\" height=\"20\" fill=\"#2F6B40\"><\u002Frect><rect x=\"78\" y=\"16\" width=\"6\" height=\"16\" fill=\"#B8AB94\"><\u002Frect><rect x=\"86\" y=\"12\" width=\"7\" height=\"20\" fill=\"#63988F\"><\u002Frect><rect x=\"95\" y=\"14\" width=\"6\" height=\"18\" fill=\"#B8AB94\"><\u002Frect><rect x=\"16\" y=\"42\" width=\"7\" height=\"20\" fill=\"#63988F\"><\u002Frect><rect x=\"25\" y=\"44\" width=\"6\" height=\"18\" fill=\"#B8AB94\"><\u002Frect><rect x=\"33\" y=\"42\" width=\"8\" height=\"20\" fill=\"#2F6B40\"><\u002Frect><rect x=\"43\" y=\"46\" width=\"6\" height=\"16\" fill=\"#B8AB94\"><\u002Frect><rect x=\"51\" y=\"42\" width=\"7\" height=\"20\" fill=\"#B8AB94\"><\u002Frect><rect x=\"60\" y=\"44\" width=\"6\" height=\"18\" fill=\"#63988F\"><\u002Frect><rect x=\"68\" y=\"42\" width=\"8\" height=\"20\" fill=\"#B8AB94\"><\u002Frect><rect x=\"78\" y=\"46\" width=\"6\" height=\"16\" fill=\"#2F6B40\"><\u002Frect><rect x=\"86\" y=\"42\" width=\"7\" height=\"20\" fill=\"#B8AB94\"><\u002Frect><rect x=\"95\" y=\"44\" width=\"6\" height=\"18\" fill=\"#B8AB94\"><\u002Frect><rect x=\"16\" y=\"72\" width=\"7\" height=\"20\" fill=\"#B8AB94\"><\u002Frect><rect x=\"25\" y=\"74\" width=\"6\" height=\"18\" fill=\"#2F6B40\"><\u002Frect><rect x=\"33\" y=\"72\" width=\"8\" height=\"20\" fill=\"#63988F\"><\u002Frect><rect x=\"43\" y=\"76\" width=\"6\" height=\"16\" fill=\"#B8AB94\"><\u002Frect><rect x=\"51\" y=\"72\" width=\"7\" height=\"20\" fill=\"#B8AB94\"><\u002Frect><rect x=\"60\" y=\"74\" width=\"6\" height=\"18\" fill=\"#B8AB94\"><\u002Frect><rect x=\"68\" y=\"72\" width=\"8\" height=\"20\" fill=\"#2F6B40\"><\u002Frect><rect x=\"78\" y=\"76\" width=\"6\" height=\"16\" fill=\"#63988F\"><\u002Frect><rect x=\"86\" y=\"72\" width=\"7\" height=\"20\" fill=\"#B8AB94\"><\u002Frect><rect x=\"95\" y=\"74\" width=\"6\" height=\"18\" fill=\"#B8AB94\"><\u002Frect><\u002Fsvg><\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:26px; color:#332C21;\">the renderer sees<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#6E6455;\">40 books · instanced meshes · thousands of tris<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"align-self:center; font-family:'JetBrains Mono',monospace; font-size:40px; color:#C9BEAC;\">vs<\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column; gap:24px; align-items:center;\">\n      <div style=\"width:520px; height:420px; border:1px solid #DCD2C0; background:#F5EFE3; padding:30px; box-sizing:border-box;\"><svg viewBox=\"0 0 120 100\" width=\"100%\" height=\"100%\"><rect x=\"10\" y=\"6\" width=\"100\" height=\"88\" fill=\"none\" stroke=\"#2F6B40\" stroke-width=\"2.5\" stroke-dasharray=\"6 4\" style=\"animation:dashmarch 3s linear infinite;\"><\u002Frect><\u002Fsvg><\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:26px; color:#2F6B40;\">physics sees<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#6E6455;\">1 cuboid collider<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto; font-family:'JetBrains Mono',monospace; font-size:27px; color:#6E6455;\">collider count ∝ gameplay surface, not visual detail. <span style=\"color:#332C21;\">This keeps the 16.6 ms budget intact.<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Same Seed\" data-speaker-notes=\"What is a seed? Random generators in computers are not actually random. They are formulas that produce a wild-looking sequence from a starting number, and that starting number is the seed. Same seed, same sequence, forever, on any machine. So a Runek component fed seed 42 places the same books at the same angles for everyone. Three machines, seed 42, three identical worlds. Change the seed to 7 and you get a different world, but that one is also identical everywhere. Now combine that with Rapier: the stage is deterministic because of seeds, and the rules are deterministic because of Rapier plus WASM's pinned floats. So the exact same jump is makeable on every machine. Speedruns, replays and shared challenges all fall out of that for free.\" style=\"background:#FCFAF4; color:#332C21; font-family:'Space Grotesk',sans-serif; box-sizing:border-box; padding:90px 100px 80px 100px; display:flex; flex-direction:column; gap:56px;\">\n  <h2 style=\"margin:0; font-size:68px; font-weight:700; letter-spacing:-0.01em;\">Same Seed, Same World<\u002Fh2>\n  <div style=\"display:flex; align-items:center; justify-content:center; gap:36px; margin-top:16px;\">\n    <div style=\"display:flex; flex-direction:column; gap:18px; align-items:center;\">\n      <div style=\"width:320px; height:320px; border:1px solid #DCD2C0; background:#F5EFE3; padding:20px; box-sizing:border-box;\"><svg viewBox=\"0 0 100 100\" width=\"100%\" height=\"100%\"><rect x=\"8\" y=\"84\" width=\"84\" height=\"4\" fill=\"#B8AB94\"><\u002Frect><rect x=\"20\" y=\"60\" width=\"20\" height=\"24\" fill=\"#2F6B40\" style=\"animation:blink 3.4s ease-in-out infinite;\"><\u002Frect><rect x=\"26\" y=\"50\" width=\"8\" height=\"10\" fill=\"#B8AB94\"><\u002Frect><rect x=\"62\" y=\"38\" width=\"12\" height=\"46\" fill=\"#B8AB94\"><\u002Frect><rect x=\"48\" y=\"72\" width=\"8\" height=\"12\" fill=\"#B8AB94\"><\u002Frect><rect x=\"42\" y=\"26\" width=\"6\" height=\"6\" fill=\"#2F6B40\" style=\"animation:blink 3.4s ease-in-out 0.5s infinite;\"><\u002Frect><\u002Fsvg><\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:26px; color:#332C21;\">seed 42<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-family:'JetBrains Mono',monospace; font-size:48px; color:#175E6B;\">=<\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column; gap:18px; align-items:center;\">\n      <div style=\"width:320px; height:320px; border:1px solid #DCD2C0; background:#F5EFE3; padding:20px; box-sizing:border-box;\"><svg viewBox=\"0 0 100 100\" width=\"100%\" height=\"100%\"><rect x=\"8\" y=\"84\" width=\"84\" height=\"4\" fill=\"#B8AB94\"><\u002Frect><rect x=\"20\" y=\"60\" width=\"20\" height=\"24\" fill=\"#2F6B40\" style=\"animation:blink 3.4s ease-in-out infinite;\"><\u002Frect><rect x=\"26\" y=\"50\" width=\"8\" height=\"10\" fill=\"#B8AB94\"><\u002Frect><rect x=\"62\" y=\"38\" width=\"12\" height=\"46\" fill=\"#B8AB94\"><\u002Frect><rect x=\"48\" y=\"72\" width=\"8\" height=\"12\" fill=\"#B8AB94\"><\u002Frect><rect x=\"42\" y=\"26\" width=\"6\" height=\"6\" fill=\"#2F6B40\" style=\"animation:blink 3.4s ease-in-out 0.5s infinite;\"><\u002Frect><\u002Fsvg><\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:26px; color:#332C21;\">seed 42<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-family:'JetBrains Mono',monospace; font-size:48px; color:#175E6B;\">=<\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column; gap:18px; align-items:center;\">\n      <div style=\"width:320px; height:320px; border:1px solid #DCD2C0; background:#F5EFE3; padding:20px; box-sizing:border-box;\"><svg viewBox=\"0 0 100 100\" width=\"100%\" height=\"100%\"><rect x=\"8\" y=\"84\" width=\"84\" height=\"4\" fill=\"#B8AB94\"><\u002Frect><rect x=\"20\" y=\"60\" width=\"20\" height=\"24\" fill=\"#2F6B40\" style=\"animation:blink 3.4s ease-in-out infinite;\"><\u002Frect><rect x=\"26\" y=\"50\" width=\"8\" height=\"10\" fill=\"#B8AB94\"><\u002Frect><rect x=\"62\" y=\"38\" width=\"12\" height=\"46\" fill=\"#B8AB94\"><\u002Frect><rect x=\"48\" y=\"72\" width=\"8\" height=\"12\" fill=\"#B8AB94\"><\u002Frect><rect x=\"42\" y=\"26\" width=\"6\" height=\"6\" fill=\"#2F6B40\" style=\"animation:blink 3.4s ease-in-out 0.5s infinite;\"><\u002Frect><\u002Fsvg><\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:26px; color:#332C21;\">seed 42<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-family:'JetBrains Mono',monospace; font-size:48px; color:#2F6B40; animation:blink 3.4s ease-in-out 1.7s infinite;\">≠<\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column; gap:18px; align-items:center;\">\n      <div style=\"width:320px; height:320px; border:1px solid #DCD2C0; background:#F5EFE3; padding:20px; box-sizing:border-box;\"><svg viewBox=\"0 0 100 100\" width=\"100%\" height=\"100%\"><rect x=\"8\" y=\"86\" width=\"84\" height=\"4\" fill=\"#B8AB94\"><\u002Frect><rect x=\"14\" y=\"52\" width=\"24\" height=\"34\" fill=\"#B8AB94\"><\u002Frect><rect x=\"48\" y=\"66\" width=\"10\" height=\"20\" fill=\"#2F6B40\" style=\"animation:blink 3.4s ease-in-out 1.7s infinite;\"><\u002Frect><rect x=\"68\" y=\"34\" width=\"10\" height=\"52\" fill=\"#B8AB94\"><\u002Frect><rect x=\"26\" y=\"30\" width=\"6\" height=\"6\" fill=\"#2F6B40\" style=\"animation:blink 3.4s ease-in-out 2.2s infinite;\"><\u002Frect><\u002Fsvg><\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:26px; color:#2F6B40;\">seed 7<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto; font-family:'JetBrains Mono',monospace; font-size:28px; color:#6E6455;\">deterministic stage <span style=\"color:#C9BEAC;\">+<\u002Fspan> deterministic rules <span style=\"color:#C9BEAC;\">→<\u002Fspan> <span style=\"color:#332C21;\">the same jump is makeable on every machine<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"World Is a File\" data-speaker-notes=\"Demo round two happens right before this slide: I flip to Edit mode, drag the house across the yard, hit export, and show the diff in the console. Because the world is just that JSON file, moving a house is a one-line change. You can read it, review it in a pull request, revert it. And notice this is the same story serde gives us for physics: the world is a file, and the physics state could be one too. Snapshot it, restore it, roll it back. Files all the way down.\" style=\"background:#FCFAF4; color:#332C21; font-family:'Space Grotesk',sans-serif; box-sizing:border-box; padding:90px 100px 80px 100px; display:flex; flex-direction:column; gap:52px;\">\n  <h2 style=\"margin:0; font-size:68px; font-weight:700; letter-spacing:-0.01em;\">The World Is a File<\u002Fh2>\n  <div style=\"display:flex; gap:60px; margin-top:10px; align-items:center;\">\n    <div style=\"flex:1; display:flex; flex-direction:column; gap:38px;\">\n      <div style=\"display:flex; gap:28px; align-items:baseline;\"><span style=\"font-family:'JetBrains Mono',monospace; font-size:26px; color:#2F6B40;\">01<\u002Fspan><span style=\"font-size:31px; line-height:1.45; color:#4A4234;\">Edit mode: drag the house across the yard<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:28px; align-items:baseline;\"><span style=\"font-family:'JetBrains Mono',monospace; font-size:26px; color:#2F6B40;\">02<\u002Fspan><span style=\"font-size:31px; line-height:1.45; color:#4A4234;\">export: the whole world serializes back to <span style=\"font-family:'JetBrains Mono',monospace; font-size:28px; color:#332C21;\">world.json<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:28px; align-items:baseline;\"><span style=\"font-family:'JetBrains Mono',monospace; font-size:26px; color:#2F6B40;\">03<\u002Fspan><span style=\"font-size:31px; line-height:1.45; color:#4A4234;\">diff: one line changed. Reviewable, versionable, revertable.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"width:700px; border:1px solid #2A251D; background:#322B22; padding:40px 44px; display:flex; flex-direction:column; gap:24px;\">\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#9C8F79;\">git diff world.json<\u002Fdiv>\n      <pre style=\"margin:0; font-family:'JetBrains Mono',monospace; font-size:27px; line-height:1.75; color:#F2ECDF;\">  \"component\": \"house\",\n  \"seed\": 42,\n<span style=\"color:#D98A70; animation:popfade 3.2s ease-in-out infinite;\">- \"position\": [4, 0, 2]\n<\u002Fspan><span style=\"color:#8FBCA6; animation:popfade 3.2s ease-in-out 1.6s infinite;\">+ \"position\": [9, 0, 2]<\u002Fspan><\u002Fpre>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto; font-family:'JetBrains Mono',monospace; font-size:27px; color:#6E6455;\">the world is a file. <span style=\"color:#332C21;\">With serde snapshots, the physics state could be too.<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Takeaways\" data-speaker-notes=\"Wrapping up. Physics is the poster-child workload for Rust: no GC, controlled layout, and the worst case is what matters. Rapier's real innovations are engineering shape, not solver math: one crate for every platform, determinism as a flag, a serializable world, a boundary-respecting API. Steal that pattern for your own crates. And the quiet one: a Rust solver can be the invisible foundation of something that looks entirely like a JavaScript project. That is WASM working as intended. Q&amp;A prep: Avian vs Rapier is Bevy ergonomics vs portability and determinism, both healthy. The WASM blob is a couple of MB, check the current number. Bit-exact determinism needs the flag plus the same engine version. Threads on the web need SharedArrayBuffer with COOP and COEP headers, the JS build is effectively single-threaded today and still fits the budget. Soft bodies, cloth and vehicles: salva for fluids, otherwise Jolt or PhysX.\" style=\"background:#FCFAF4; color:#332C21; font-family:'Space Grotesk',sans-serif; box-sizing:border-box; padding:90px 100px 80px 100px; display:flex; flex-direction:column; gap:60px;\">\n  <h2 style=\"margin:0; font-size:68px; font-weight:700; letter-spacing:-0.01em;\">Takeaways<\u002Fh2>\n  <div style=\"display:flex; flex-direction:column; gap:40px; margin-top:10px; max-width:1560px;\">\n    <div style=\"display:flex; gap:44px; align-items:baseline;\"><span style=\"font-family:'JetBrains Mono',monospace; font-size:28px; color:#2F6B40;\">01<\u002Fspan><span style=\"font-size:36px; line-height:1.4;\">Physics is Rust's poster-child workload: GC-free, layout-controlled, tail-latency-dominated.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:44px; align-items:baseline;\"><span style=\"font-family:'JetBrains Mono',monospace; font-size:28px; color:#2F6B40;\">02<\u002Fspan><span style=\"font-size:36px; line-height:1.4;\">Rapier's real innovations are engineering shape, not solver math.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:44px; align-items:baseline;\"><span style=\"font-family:'JetBrains Mono',monospace; font-size:28px; color:#2F6B40;\">03<\u002Fspan><span style=\"font-size:36px; line-height:1.4;\">Steal the pattern: arena + handles, batch the FFI, serde the state.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:44px; align-items:baseline;\"><span style=\"font-family:'JetBrains Mono',monospace; font-size:28px; color:#2F6B40;\">04<\u002Fspan><span style=\"font-size:36px; line-height:1.4;\">A Rust solver can be the invisible foundation of a thing that looks entirely like JavaScript. That is WASM working as intended.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto; border-top:1px solid #DCD2C0; padding-top:36px; display:flex; gap:24px; align-items:center; flex-wrap:wrap;\">\n    <div style=\"display:inline-flex; align-items:center; gap:18px; border:1px solid #DCD2C0; background:#F5EFE3; padding:16px 24px;\">\n      <span style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#6E6455;\">github<\u002Fspan>\n      <span style=\"width:1px; align-self:stretch; background:#DCD2C0;\"><\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#332C21;\">dimforge/rapier<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#2F6B40;\">↗<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:inline-flex; align-items:center; gap:18px; border:1px solid #DCD2C0; background:#F5EFE3; padding:16px 24px;\">\n      <span style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#6E6455;\">github<\u002Fspan>\n      <span style=\"width:1px; align-self:stretch; background:#DCD2C0;\"><\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#332C21;\">nullorder/helicon<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#2F6B40;\">↗<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:inline-flex; align-items:center; gap:18px; border:1px solid #DCD2C0; background:#F5EFE3; padding:16px 24px;\">\n      <span style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#6E6455;\">github<\u002Fspan>\n      <span style=\"width:1px; align-self:stretch; background:#DCD2C0;\"><\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#332C21;\">nullorder/runek<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace; font-size:24px; color:#2F6B40;\">↗<\u002Fspan>\n    <\u002Fdiv>\n    <span style=\"font-family:'JetBrains Mono',monospace; font-size:25px; color:#6E6455;\">rapier.rs<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fdeck-stage>\n<button id=\"fsbtn\" title=\"Fullscreen (F)\">⛶<\u002Fbutton>\n<script>\n(function () {\n  var FINE = matchMedia('(pointer: fine)');\n  function key(k) { window.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true })); }\n  function toggleFS() {\n    if (document.fullscreenElement) { document.exitFullscreen(); }\n    else { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }\n  }\n  document.getElementById('fsbtn').addEventListener('click', function (e) { e.stopPropagation(); toggleFS(); });\n  window.addEventListener('keydown', function (e) { if (e.key === 'f' || e.key === 'F') toggleFS(); });\n  // Hide the thumbnail rail (and the fullscreen button) while presenting fullscreen.\n  document.addEventListener('fullscreenchange', function () {\n    var fs = !!document.fullscreenElement;\n    window.postMessage({ __omelette_presenting: fs }, '*');\n    document.getElementById('fsbtn').style.display = fs ? 'none' : '';\n  });\n  // Click = next, double-click = previous (fine pointers only; touch taps are handled by the stage).\n  var timer = null;\n  document.addEventListener('click', function (e) {\n    if (!FINE.matches) return;\n    if (e.target.closest('#fsbtn, a, button, input, select, textarea, image-slot')) return;\n    if (timer) return;\n    timer = setTimeout(function () { timer = null; key('ArrowRight'); }, 280);\n  });\n  document.addEventListener('dblclick', function (e) {\n    if (!FINE.matches) return;\n    if (e.target.closest('#fsbtn, a, button, input, select, textarea, image-slot')) return;\n    if (timer) { clearTimeout(timer); timer = null; }\n    var sel = window.getSelection && window.getSelection(); if (sel) sel.removeAllRanges();\n    key('ArrowLeft');\n  });\n})();\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
