<style>
/* ─────────────────────────────────────────────────────────────
   Pixelspace — 5x7 pixel display face by Kumar Anirudha
   https://pixelspace.anirudha.dev · SIL OFL 1.1 (fonts/OFL.txt)
   ───────────────────────────────────────────────────────────── */
@font-face {
    font-family: "Pixelspace";
    src: url("fonts/Pixelspace-Regular.woff2") format("woff2"),
         url("fonts/Pixelspace-Regular.ttf")   format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
}

:root {
    /* ink */
    --bg:        #07090a;
    --panel:     #0d1114;
    --panel-hi:  #111719;
    --line:      #1c2529;
    --ink:       #cdd8da;
    --ink-body:  #9fb0b3;
    --ink-dim:   #8a9a9f;
    --ink-faint: #55666b;

    /* the one accent + the one semantic */
    --acc:       #4ade9b;
    --acc-glow:  rgba(74, 222, 155, .16);
    --warn:      #ffb454;

    /* type — Pixelspace is a display face; long prose stays in mono.
       Flip --font-body to var(--font-px) to go full pixel. */
    --font-px:   "Pixelspace", ui-monospace, monospace;
    --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --font-body: var(--font-mono);

    /* Pixelspace draws crisp at font-sizes that are multiples of 7 */
    --t-xs: 11px;
    --t-sm: 14px;
    --t-md: 21px;
    --t-lg: 28px;
    --t-xl: 42px;

    --stagger: 45ms;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
    background: var(--bg);
    color: var(--ink-body);
    font-family: var(--font-body);
    font-size: var(--t-sm);
    line-height: 1.7;
    min-height: 100vh;
    padding: clamp(28px, 6vw, 72px) clamp(16px, 4vw, 32px);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;

    /* Pixelspace is monospace by construction — kerning and ligatures
       only blur the grid. Off everywhere. */
    font-kerning: none;
    font-variant-ligatures: none;
}

.px { font-family: var(--font-px); }

/* ── CRT overlay: scanlines + grid + vignette ─────────────── */
.crt { position: fixed; inset: 0; pointer-events: none; z-index: 100; }

.crt::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(200, 255, 230, .028) 0 1px,
        transparent 1px 3px
    );
}

.crt::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse 120% 90% at 50% 0%, transparent 40%, rgba(0,0,0,.55) 100%);
}

.grid-bg {
    position: fixed;
    inset: -1px;
    pointer-events: none;
    z-index: -1;
    background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 32px 32px;
    opacity: .28;
    mask-image: radial-gradient(ellipse 90% 70% at 50% 20%, #000 20%, transparent 85%);
}

.container { max-width: 1180px; margin: 0 auto; position: relative; }

/* ── header ───────────────────────────────────────────────── */
header { margin-bottom: clamp(32px, 5vw, 56px); }

.topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
}

.prompt {
    flex: 1;
    min-width: 0;            /* let the shell line ellipsis instead of pushing */
    font-family: var(--font-px);
    font-size: var(--t-sm);
    color: var(--ink-faint);
    letter-spacing: .02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.social { display: flex; gap: 6px; flex-shrink: 0; }

.social-btn {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    transition: color .18s, border-color .18s, background-color .18s;
}
.social-btn svg { width: 13px; height: 13px; fill: currentColor; display: block; }
.social-btn:hover, .social-btn:focus-visible {
    color: var(--acc);
    border-color: var(--acc);
    background: var(--acc-glow);
    outline: none;
}
.prompt .user { color: var(--acc); }
.prompt .cmd  { color: var(--ink-dim); }

.cursor {
    color: var(--acc);
    animation: blink 1.05s steps(1, end) infinite;
}

h1 {
    font-family: var(--font-px);
    font-size: clamp(24px, 5.6vw, var(--t-xl));
    line-height: 1.25;
    color: var(--ink);
    letter-spacing: .01em;
    font-weight: 400;
    margin-bottom: 14px;
}
h1 .hl { color: var(--acc); text-shadow: 0 0 22px var(--acc-glow); }

.sub {
    font-family: var(--font-px);
    font-size: var(--t-sm);
    color: var(--ink-dim);
    letter-spacing: .02em;
}
.sub b { color: var(--ink); font-weight: 400; }

.rule {
    height: 1px;
    background: linear-gradient(90deg, var(--acc), var(--line) 22%, var(--line) 100%);
    margin-top: 24px;
    opacity: .8;
}

/* ── console / filter bar ─────────────────────────────────── */
.console {
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 14px 16px;
    margin-bottom: clamp(24px, 4vw, 40px);
    display: grid;
    gap: 14px;
}

.searchrow { display: flex; align-items: center; gap: 10px; }
.searchrow .chev { color: var(--acc); font-family: var(--font-px); font-size: var(--t-sm); }

#q {
    flex: 1;
    min-width: 0;
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    border: 0;
    outline: 0;
    color: var(--ink);
    font-family: var(--font-px);
    font-size: var(--t-sm);
    letter-spacing: .02em;
    padding: 4px 0;
}
#q::placeholder { color: var(--ink-faint); }
#q::-webkit-search-decoration,
#q::-webkit-search-cancel-button { -webkit-appearance: none; }

.kbd {
    font-family: var(--font-px);
    font-size: var(--t-xs);
    color: var(--ink-faint);
    border: 1px solid var(--line);
    padding: 3px 7px;
    white-space: nowrap;
}
.searchrow:focus-within .kbd { opacity: 0; }

.filters { display: flex; flex-wrap: wrap; gap: 6px; }

.chip, .sortbtn {
    font-family: var(--font-px);
    font-size: var(--t-xs);
    letter-spacing: .04em;
    color: var(--ink-dim);
    background: transparent;
    border: 1px solid var(--line);
    padding: 5px 10px;
    cursor: pointer;
    transition: color .18s, border-color .18s, background-color .18s;
}
.chip:hover, .sortbtn:hover { color: var(--ink); border-color: var(--ink-faint); }
.chip[aria-pressed="true"] {
    color: var(--acc);
    border-color: var(--acc);
    background: var(--acc-glow);
}

.sortrow {
    display: flex;
    align-items: center;
    gap: 8px;
    border-top: 1px solid var(--line);
    padding-top: 12px;
}
.sortbtn { border: 0; padding: 4px 6px; }
.sortbtn[aria-pressed="true"] { color: var(--acc); }
.sortrow .label { font-family: var(--font-px); font-size: var(--t-xs); color: var(--ink-faint); letter-spacing: .04em; }
.sortrow .count { margin-left: auto; font-family: var(--font-px); font-size: var(--t-xs); color: var(--ink-faint); }

/* ── grid ─────────────────────────────────────────────────── */
/* 1px gaps + a 1px outset ring per card: adjacent rings meet exactly in
   the gap and read as a single hairline lattice, while an unfilled cell
   in the last row stays empty instead of showing a ghost panel. */
.talks-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap: 1px;
}

/* ── card ─────────────────────────────────────────────────── */
.card {
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    padding: 22px 20px 18px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 0 0 1px var(--line);
    transition: background-color .22s ease, transform .22s ease, box-shadow .22s ease;
    animation: cardIn .5s cubic-bezier(.2, .7, .3, 1) both;
    animation-delay: calc(var(--i, 0) * var(--stagger));
}

/* corner reticle: top-left + bottom-right */
.card::before,
.card::after {
    content: "";
    position: absolute;
    width: 12px;
    height: 12px;
    border: 1px solid var(--ink-faint);
    opacity: .5;
    transition: width .22s ease, height .22s ease, border-color .22s ease, opacity .22s ease;
}
.card::before { top: 7px;  left: 7px;  border-right: 0; border-bottom: 0; }
.card::after  { bottom: 7px; right: 7px; border-left: 0;  border-top: 0; }

.card:hover, .card:focus-visible {
    background: var(--panel-hi);
    transform: translateY(-2px);
    box-shadow: 0 0 0 1px var(--acc), 0 0 34px -8px var(--acc-glow);
    z-index: 2;
    outline: none;
}
.card:hover::before, .card:hover::after,
.card:focus-visible::before, .card:focus-visible::after {
    width: 24px;
    height: 24px;
    border-color: var(--acc);
    opacity: 1;
}

.card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
}

.card-title {
    font-family: var(--font-px);
    font-size: var(--t-sm);
    font-weight: 400;
    line-height: 1.5;
    color: var(--ink);
    letter-spacing: .02em;
    transition: color .18s;
}
.card:hover .card-title, .card:focus-visible .card-title { color: var(--acc); }

.badge {
    flex-shrink: 0;
    font-family: var(--font-px);
    font-size: var(--t-xs);
    letter-spacing: .06em;
    padding: 3px 6px;
    border: 1px solid currentColor;
    line-height: 1.2;
}
.badge--deck { color: var(--acc); }
.badge--pdf  { color: var(--warn); }

.card-meta {
    font-family: var(--font-px);
    font-size: var(--t-xs);
    color: var(--ink-faint);
    letter-spacing: .04em;
    margin-bottom: 14px;
}

.card-desc {
    font-size: 13px;
    line-height: 1.75;
    color: var(--ink-body);
    margin-bottom: 16px;
    flex: 1;
}

.card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px 10px;
    font-family: var(--font-px);
    font-size: var(--t-xs);
    color: var(--ink-faint);
    letter-spacing: .03em;
    margin-bottom: 16px;
}
.card-tags span { transition: color .18s; }
.card:hover .card-tags span { color: var(--ink-dim); }

.card-go {
    font-family: var(--font-px);
    font-size: var(--t-xs);
    letter-spacing: .08em;
    color: var(--ink-faint);
    border-top: 1px solid var(--line);
    padding-top: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: color .18s, border-color .18s;
}
.card:hover .card-go, .card:focus-visible .card-go {
    color: var(--acc);
    border-color: rgba(74, 222, 155, .3);
}
.card-go .arrow { display: inline-block; transition: transform .22s ease; }
.card:hover .card-go .arrow { transform: translateX(5px); }

.empty {
    font-family: var(--font-px);
    font-size: var(--t-sm);
    color: var(--ink-faint);
    text-align: center;
    padding: 56px 20px;
    letter-spacing: .02em;
}
.empty[hidden] { display: none; }

/* ── footer ───────────────────────────────────────────────── */
footer {
    margin-top: clamp(40px, 6vw, 72px);
    padding-top: 22px;
    border-top: 1px solid var(--line);
    font-family: var(--font-px);
    font-size: var(--t-xs);
    color: var(--ink-faint);
    letter-spacing: .03em;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 20px;
    justify-content: space-between;
    line-height: 2;
}

a.link {
    color: var(--ink-dim);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    transition: color .18s, border-color .18s;
}
a.link:hover, a.link:focus-visible {
    color: var(--acc);
    border-color: var(--acc);
    outline: none;
}

/* ── keyframes ────────────────────────────────────────────── */
@keyframes cardIn {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
}
@keyframes blink {
    0%, 49%   { opacity: 1; }
    50%, 100% { opacity: 0; }
}

/* ── responsive ───────────────────────────────────────────── */
@media (max-width: 640px) {
    .talks-grid { grid-template-columns: 1fr; }
    .prompt { font-size: var(--t-xs); }
    footer { flex-direction: column; gap: 2px; }
}

/* ── motion safety ────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .card { animation: none; }
    .cursor { animation: none; }
    .card:hover, .card:focus-visible { transform: none; }
    .card::before, .card::after { transition: border-color .18s, opacity .18s; }
    .card-go .arrow { transition: none; }
    * { transition-duration: .01ms !important; }
}
</style>
</head>

    },
    {
        name: "Decentralising with Ethereum",
        venue: "", year: 2017,
        path: "decentralising-with-ethereum", format: "deck",
        description: "Building decentralised systems on Ethereum and the tooling that grew up around it.",
        tags: ["ethereum", "smart contracts", "web3"]
    },
    {
        name: "Diving into Blockchain",
        venue: "", year: 2017,
        path: "blockchainIntro", format: "deck",
        description: "An in-depth look at how blockchains actually work and where they hold up in the real world.",
        tags: ["blockchain", "distributed systems"]
    },
    {
        name: "Node.js: An Introduction",
        venue: "", year: 2016,
        path: "nodeIntroduction", format: "deck",
        description: "Getting started with Node.js and the event loop model behind scalable server-side JavaScript.",
        tags: ["nodejs", "javascript", "backend"]
    }
];

/* ── refs ─────────────────────────────────────────────────── */
const container = document.getElementById('talksContainer');
const filtersEl = document.getElementById('filters');
const emptyEl   = document.getElementById('empty');
const countEl   = document.getElementById('count');
const qEl       = document.getElementById('q');

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const state = { q: '', tag: '*', sort: 'recent' };

/* ── header stats ─────────────────────────────────────────── */
const years = talks.map(t => t.year);
document.getElementById('statCount').textContent = talks.length;
document.getElementById('statYears').textContent = Math.min(...years) + '-' + Math.max(...years);
document.getElementById('year').textContent = new Date().getFullYear();

/* ── build cards once ─────────────────────────────────────── */
const nodes = talks.map((talk, ord) => {
    const el = document.createElement('a');
    el.className = 'card';
    talk.ord = ord;   // ties inside a year keep the order declared above
    el.href = talk.format === 'pdf' ? talk.path : talk.path + '/index.html';
    if (talk.format === 'pdf') { el.target = '_blank'; el.rel = 'noopener'; }

    const badge = talk.format === 'pdf' ? 'PDF' : 'DECK';
    const meta  = [talk.venue, talk.year].filter(Boolean).join(' · ');
    const go    = talk.format === 'pdf' ? 'open pdf' : 'open deck';

    el.innerHTML =
        '<div class="card-top">' +
            '<h2 class="card-title">' + talk.name + '</h2>' +
            '<span class="badge badge--' + talk.format + '">' + badge + '</span>' +
        '</div>' +
        '<div class="card-meta">' + meta + '</div>' +
        '<p class="card-desc">' + talk.description + '</p>' +
        '<div class="card-tags">' + talk.tags.map(t => '<span>#' + t + '</span>').join('') + '</div>' +
        '<div class="card-go"><span>' + go + '</span><span class="arrow">&gt;&gt;</span></div>';

    el.dataset.haystack = [talk.name, talk.venue, talk.year, talk.description, talk.tags.join(' ')]
        .join(' ').toLowerCase();
    el.dataset.tags = talk.tags.join('|');
    el._talk = talk;
    return el;
});

/* ── tag chips: most common first, long tail lives in search ─ */
const counts = new Map();
talks.forEach(t => t.tags.forEach(tag => counts.set(tag, (counts.get(tag) || 0) + 1)));
const topTags = [...counts.entries()]
    .filter(([, n]) => n > 1)
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .slice(0, 9)
    .map(([tag]) => tag);

[['*', 'all'], ...topTags.map(t => [t, t])].forEach(([value, label]) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.dataset.tag = value;
    b.textContent = label;
    b.setAttribute('aria-pressed', String(value === '*'));
    b.addEventListener('click', () => {
        state.tag = state.tag === value ? '*' : value;
        filtersEl.querySelectorAll('.chip').forEach(c =>
            c.setAttribute('aria-pressed', String(c.dataset.tag === state.tag)));
        apply();
    });
    filtersEl.appendChild(b);
});

/* ── sort ─────────────────────────────────────────────────── */
document.querySelectorAll('.sortbtn').forEach(btn => {
    btn.addEventListener('click', () => {
        state.sort = btn.dataset.sort;
        document.querySelectorAll('.sortbtn').forEach(b =>
            b.setAttribute('aria-pressed', String(b.dataset.sort === state.sort)));
        apply();
    });
});

/* ── search ───────────────────────────────────────────────── */
qEl.addEventListener('input', () => { state.q = qEl.value.trim().toLowerCase(); apply(); });

document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== qEl) {
        e.preventDefault();
        qEl.focus();
    } else if (e.key === 'Escape' && document.activeElement === qEl) {
        qEl.value = '';
        state.q = '';
        qEl.blur();
        apply();
    }
});

/* ── render ───────────────────────────────────────────────── */
function apply() {
    const visible = nodes.filter(el =>
        (state.tag === '*' || el.dataset.tags.split('|').includes(state.tag)) &&
        (!state.q || el.dataset.haystack.includes(state.q))
    );

    visible.sort((a, b) => state.sort === 'az'
        ? a._talk.name.localeCompare(b._talk.name)
        : b._talk.year - a._talk.year || a._talk.ord - b._talk.ord
    );

    const frag = document.createDocumentFragment();
    visible.forEach((el, i) => {
        el.style.setProperty('--i', Math.min(i, 24));
        frag.appendChild(el);
    });

    // detach everything, flush layout, re-attach — restarts the stagger
    // so filtered results cascade in instead of popping.
    container.replaceChildren();
    void container.offsetWidth;
    container.appendChild(frag);

    emptyEl.hidden = visible.length > 0;
    countEl.textContent = visible.length + ' / ' + talks.length;
}

apply();

/* ── boot sequence ────────────────────────────────────────── */
(function boot() {
    const cmdEl   = document.getElementById('cmd');
    const titleEl = document.getElementById('title');
    const command = 'ls -la ./presentations';
    const target  = titleEl.dataset.text;

    if (reduceMotion) { cmdEl.textContent = command; return; }

    // type the shell command
    let i = 0;
    (function type() {
        cmdEl.textContent = command.slice(0, ++i);
        if (i < command.length) setTimeout(type, 32);
    })();

    // decode the title out of noise
    const noise = '!<>-_\\/[]{}=+*^?#01';
    const DUR = 700;
    let start = null;
    let done = false;

    const settle = () => { done = true; titleEl.textContent = target; };

    requestAnimationFrame(function scramble(now) {
        if (done) return;
        if (start === null) start = now;

        const p = Math.min((now - start) / DUR, 1);
        const settled = Math.floor(p * target.length);
        let out = target.slice(0, settled);
        for (let j = settled; j < target.length; j++) {
            out += target[j] === ' ' ? ' ' : noise[(Math.random() * noise.length) | 0];
        }
        titleEl.textContent = out;

        if (p < 1) requestAnimationFrame(scramble); else settle();
    });

    // never leave the heading stuck as noise if rAF timestamps stall
    setTimeout(settle, DUR + 500);
})();
</script>
</body>
